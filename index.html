<!DOCTYPE html>
<!--
  GESTIONALE INTERVENTI - versione online con accesso e ruoli (Firebase)

  Questo file si usa così com'è: la configurazione del progetto Firebase è già inserita.
  Va caricato come index.html sul sito (GitHub Pages) e richiede:
   1. Firebase > Authentication: metodo "Email/password" attivo.
   2. Firebase > Authentication > Settings > Authorized domains: l'indirizzo del sito
      (es. nomeutente.github.io).
   3. Firebase > Firestore Database > Rules: incollare il contenuto del file firestore.rules e pubblicare.
   4. Primo accesso: registrarsi dalla pagina, poi in Firestore > raccolta "utenti" aprire il documento
      con la propria email e impostare il campo ruolo = titolare (una sola volta).
  Gli altri utenti si registrano dalla pagina e il titolare assegna il ruolo dal menu "Utenti".

  Facoltativo: suggerimenti di indirizzo Geoapify (chiave nella costante GEOAPIFY_API_KEY).
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestionale interventi</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B5FFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Interventi">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface2:#F6F8FA; --ink:#101826; --muted:#5A6678; --line:#DFE4EB;
  --brand:#0B5FFF; --brand-ink:#FFFFFF; --brand-tint:#E4ECFF; --brand-text:#0A4BD1;
  --ok:#0F9D63; --ok-tint:#E0F5EB; --ok-text:#0A6B43;
  --warn:#E8A317; --warn-tint:#FFF3D6; --warn-text:#7A4B05;
  --bad:#D92D4B; --bad-tint:#FDE6EA; --bad-text:#B01E38;
  --shadow:0 1px 2px rgba(16,24,38,.05);
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1018; --surface:#131B27; --surface2:#19232F; --ink:#E9EFF7; --muted:#97A3B6; --line:#243042;
    --brand:#5B8CFF; --brand-ink:#08142E; --brand-tint:#16284A; --brand-text:#A5C0FF;
    --ok:#3DD598; --ok-tint:#0F2F27; --ok-text:#7BE8B9;
    --warn:#FFC15A; --warn-tint:#3A2A0A; --warn-text:#FFD58C;
    --bad:#FF7A90; --bad-tint:#3B1620; --bad-text:#FF9DAE;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1018; --surface:#131B27; --surface2:#19232F; --ink:#E9EFF7; --muted:#97A3B6; --line:#243042;
  --brand:#5B8CFF; --brand-ink:#08142E; --brand-tint:#16284A; --brand-text:#A5C0FF;
  --ok:#3DD598; --ok-tint:#0F2F27; --ok-text:#7BE8B9;
  --warn:#FFC15A; --warn-tint:#3A2A0A; --warn-text:#FFD58C;
  --bad:#FF7A90; --bad-tint:#3B1620; --bad-text:#FF9DAE;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
.c0{--wc:#2563EB}.c1{--wc:#0D9488}.c2{--wc:#D9480F}.c3{--wc:#7C3AED}
.c4{--wc:#BE185D}.c5{--wc:#4D7C0F}.c6{--wc:#0E7490}.c7{--wc:#A16207}
.c-none{--wc:var(--muted)}

html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.5 var(--font-body);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ol,dl,dd{margin:0}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ic{flex:none;vertical-align:-3px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.nowrap{white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* intestazione */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 0 4px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--surface);display:grid;place-items:center;flex:none}
h1{font-size:19px;flex:1}
#sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
#sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
#sync[data-s="online"]::before{background:var(--ok)}
#sync[data-s="local"]::before{background:var(--warn)}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--muted)}
nav.menu{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -8px}
nav.menu::-webkit-scrollbar{display:none}
nav.menu button{flex:none;min-height:46px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:transparent;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
nav.menu button:hover{color:var(--ink)}
nav.menu button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--brand)}
.pill{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-size:12.5px;font-weight:600}
.pill.warn{background:var(--warn-tint);border-color:var(--warn);color:var(--warn-text)}

main{padding:22px 0 64px}

/* bottoni e campi */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font-weight:500;text-decoration:none;cursor:pointer;line-height:1.1;text-align:center;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad-text);border-color:var(--bad);background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:9px}
.btn.ghost{background:transparent}
.linkbtn{border:0;background:none;padding:0;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkbtn:hover{text-decoration-color:var(--brand)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>span{font-size:13px;color:var(--muted);font-weight:500}
.field small{color:var(--muted);font-size:13px}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:var(--surface)}
textarea{min-height:90px;resize:vertical}
.check{flex-direction:row;align-items:center;gap:10px}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--brand)}
.check span{font-size:15.5px;color:var(--ink)}
.fgrid{display:grid;gap:0 16px;grid-template-columns:1fr}
@media (min-width:640px){.fgrid{grid-template-columns:repeat(2,1fr)}.fgrid .span2{grid-column:1/-1}}
@media (min-width:900px){.fgrid.cols3{grid-template-columns:repeat(3,1fr)}}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.swatches{border:0;padding:0;margin:0 0 14px;grid-column:1/-1}
.swatches legend{font-size:13px;color:var(--muted);font-weight:500;padding:0;margin-bottom:6px}
.swatches div{display:flex;gap:10px;flex-wrap:wrap}
.sw{position:relative;display:block}
.sw input{position:absolute;opacity:0;width:100%;height:100%;inset:0;margin:0;cursor:pointer}
.sw span{display:block;width:32px;height:32px;border-radius:50%;background:var(--wc)}
.sw input:checked+span{outline:3px solid var(--ink);outline-offset:2px}
.sw input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}

/* struttura pagine */
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h2{font-size:26px;font-weight:600}
.pagehead .sub{color:var(--muted);margin-top:2px}
.pagehead.compact h2{font-size:19px}
.page-title{font-size:22px;margin-bottom:14px}
.datebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.datebar input[type=date]{width:auto;min-width:150px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel>h2,.panel-title{font-size:17px;margin-bottom:12px}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;min-height:34px;padding:0 13px;border-radius:7px;font-weight:500;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg.wide{display:flex}.seg.wide button{flex:1;justify-content:center}
.edit-banner{background:var(--warn-tint);color:var(--warn-text);border-radius:10px;padding:9px 14px;margin-bottom:14px;font-weight:500}
.notice{background:var(--warn-tint);color:var(--warn-text);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:26px 22px}
.empty h3{font-size:18px;margin-bottom:4px}
.empty p{color:var(--muted);margin-bottom:12px}

/* indicatori */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media (min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .n{font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.alert{background:var(--warn-tint);border-color:var(--warn)}
.kpi.alert .l,.kpi.alert .s{color:var(--warn-text)}
.dash{display:grid;gap:16px}
@media (min-width:1000px){.dash{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);align-items:start}}
.dash .panel{margin-bottom:0}
.stack{display:grid;gap:16px}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--surface2)}
.alert .ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.alert.warn .ico{background:var(--warn-tint);color:var(--warn-text)}
.alert.bad .ico{background:var(--bad-tint);color:var(--bad-text)}
.alert.ok .ico{background:var(--ok-tint);color:var(--ok-text)}
.alert .msg{flex:1;font-size:14.5px}

/* tabella */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:560px}
.tbl th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.st-fatto td{opacity:.7}
.wtag{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.stat::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.stat.st-in_corso{background:var(--brand-tint);color:var(--brand-text)}
.stat.st-in_corso::before{background:var(--brand)}
.stat.st-fatto{background:var(--ok-tint);color:var(--ok-text)}
.stat.st-fatto::before{background:var(--ok)}

/* avatar, barre, tag */
.av{width:38px;height:38px;border-radius:50%;background:var(--wc,var(--muted));color:#fff;display:grid;place-items:center;font:600 14px var(--font-body);flex:none}
.av.sm{width:30px;height:30px;font-size:12px}
.meter{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--wc,var(--brand))}
.meter.over i{background:var(--bad)}
.loadline{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin:6px 0 4px}
.loadline em{font-style:normal;font-weight:600;color:var(--ink)}
.loadline.over em{color:var(--bad-text)}
.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;display:flex}
.progress i{display:block;height:100%}
.progress .d{background:var(--ok)}
.progress .p{background:var(--brand)}
.dotw{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--wc,var(--muted));flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;margin:0 6px 0 0;vertical-align:middle;background:var(--surface2);color:var(--muted)}
.tag.urgent{background:var(--bad-tint);color:var(--bad-text)}
.tag.late{background:var(--warn-tint);color:var(--warn-text)}
.tag.type{background:var(--brand-tint);color:var(--brand-text)}
.tag.paused{margin-left:8px}
.wl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.wl .av{grid-row:span 2}
.lines{display:grid;gap:16px}

/* righe compatte (Carica lavori, Archivio) */
.rows{display:grid;gap:8px}
.row{position:relative;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;padding:10px 14px 10px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--wc,var(--line))}
.row.st-fatto{opacity:.72}
.row-time{font:600 15px/1.5 var(--font-mono);min-width:56px}
.row-main{flex:1 1 220px;min-width:0}
.row-main small{display:block;color:var(--muted);font-size:13.5px}
.row .acts{display:flex;gap:8px;flex-wrap:wrap}

/* Assegna */
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.subnav button{min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:500;display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.subnav button:hover{border-color:var(--muted)}
.subnav button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.statline{display:flex;flex-wrap:wrap;gap:4px 24px;margin-bottom:14px;color:var(--muted)}
.statline b{color:var(--ink);font-size:18px;font-weight:600;margin-right:5px;font-variant-numeric:tabular-nums}
.statline .warnx b{color:var(--warn-text)}
.notice .untimed{margin-top:8px}
.wzctx{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--surface2);border-radius:10px;margin-bottom:14px}
.wzctx small{display:block;color:var(--muted);font-size:13.5px}
.mini{display:flex;gap:10px;font-size:13.5px;color:var(--muted);padding:2px 0}
.pick{display:grid;gap:8px;margin-bottom:14px}
.pitem{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.pitem:hover{border-color:var(--muted)}
.pitem.sel{border-color:var(--brand);background:var(--brand-tint)}
.pitem input{width:22px;height:22px;min-height:0;accent-color:var(--brand);margin-top:1px;flex:none}
.pmain{flex:1;min-width:0}
.pmain .t{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:baseline}
.pmain .t .mono{font-weight:600}
.pmain small{display:block;color:var(--muted);font-size:13.5px}
.pmain small.moved{color:var(--warn-text)}
.wz-bar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 -6px 18px rgba(16,24,38,.10)}
.wz-sum{flex:1 1 260px;min-width:0}
.wz-warn{font-size:13.5px;color:var(--warn-text);margin-top:3px;display:flex;gap:6px;align-items:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* planner: timeline */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;box-shadow:var(--shadow)}
.tl-in{min-width:max-content}
.tl-row{display:grid;grid-template-columns:212px auto;border-top:1px solid var(--line)}
.tl-row.head{border-top:0;background:var(--surface2)}
.tl-label{position:sticky;left:0;z-index:3;background:var(--surface);padding:10px 12px;border-right:1px solid var(--line)}
.tl-row.head .tl-label{background:var(--surface2)}
.tl-id{display:flex;gap:10px;align-items:center}
.tl-id b{display:block;font-weight:600;line-height:1.2}
.tl-id small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.tl-label .loadline{margin:8px 0 4px}
.untimed{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.uchip{border:1px dashed var(--muted);background:var(--surface);border-radius:999px;padding:1px 9px;font-size:12px;cursor:pointer;color:var(--ink)}
.tl-hours{position:relative;height:32px}
.tl-hours span{position:absolute;top:7px;font:500 12px var(--font-mono);color:var(--muted);padding-left:6px}
.tl-track{position:relative;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px)}
.off{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--muted) 14%,transparent) 6px 12px);pointer-events:none}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2;pointer-events:none}
.tl-track.over{outline:2px dashed var(--brand);outline-offset:-2px}
.blk{position:absolute;height:46px;border-radius:8px;padding:4px 8px;background:color-mix(in srgb,var(--wc) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--wc) 45%,transparent);border-left:4px solid var(--wc);overflow:hidden;font-size:12.5px;line-height:1.3;cursor:pointer;text-align:left;color:var(--ink);z-index:1}
.blk b{display:block;font:600 12px var(--font-mono)}
.blk span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.blk.st-in_corso{box-shadow:inset 0 -3px 0 var(--brand)}
.blk.st-fatto{opacity:.55;box-shadow:inset 0 -3px 0 var(--ok)}
.blk.clash{outline:2px solid var(--bad);outline-offset:-2px}

/* planner: elenco */
.lanes{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-items:start}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.lane.over{outline:2px dashed var(--brand);outline-offset:2px}
.lane-head{display:flex;gap:12px;align-items:center;padding:12px 14px 0;flex-wrap:wrap}
.lane-id{flex:1;min-width:140px}
.lane-id h3{font-size:16.5px;line-height:1.2}
.lane-id .sub{color:var(--muted);font-size:13px}
.lane-load{padding:0 14px 12px}
.zone-actions{display:flex;gap:6px;flex-wrap:wrap}
.zone-empty{color:var(--muted);font-size:14.5px;padding:12px 14px;border-top:1px solid var(--line)}
.arow{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.arow[draggable="true"]{cursor:grab}
.arow.st-fatto{opacity:.75}
.atime{font:600 13px/1.3 var(--font-mono);min-width:88px;color:var(--ink)}
.amain{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.amain strong{font-weight:600}
.amain small{display:block;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
span.chip{cursor:default}
.st-in_corso .chip{background:var(--brand-tint);border-color:transparent;color:var(--brand-text)}
.st-in_corso .chip::before{background:var(--brand)}
.st-fatto .chip{background:var(--ok-tint);border-color:transparent;color:var(--ok-text)}
.st-fatto .chip::before{background:var(--ok)}

/* lavoratori */
.workers{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.worker{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.worker.paused{opacity:.7}
.worker .head{display:flex;gap:12px;align-items:center}
.worker h3{font-size:17px;line-height:1.2}
.worker .meta{color:var(--muted);font-size:14.5px}
.worker .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* compilazione da messaggio */
details.smart{border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:0 14px;margin-bottom:16px}
details.smart summary{min-height:46px;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;list-style:none}
details.smart summary::-webkit-details-marker{display:none}
details.smart[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details.smart .inner{padding-bottom:14px}
details.smart textarea{background:var(--surface)}

/* suggerimenti indirizzo */
.field>.lbl{font-size:13px;color:var(--muted);font-weight:500}
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(16,24,38,.16);padding:4px;max-height:300px;overflow:auto}
.ac-item{display:flex;gap:10px;align-items:center;min-height:44px;padding:6px 10px;border-radius:8px;cursor:pointer}
.ac-item .ic{color:var(--muted)}
.ac-item span{flex:1;min-width:0;overflow-wrap:anywhere}
.ac-item b{font-weight:700}
.ac-item small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.ac-item:hover,.ac-item[aria-selected="true"]{background:var(--brand-tint)}
.ac-attr{padding:6px 10px 4px;font-size:11.5px;color:var(--muted);text-align:right}
.ac-attr a{color:inherit;text-decoration:underline}

/* fasce orarie */
fieldset.field{border:0;padding:0;margin:0 0 14px;min-width:0}
legend.lbl{padding:0;margin-bottom:5px}
.seg label{position:relative;min-height:34px;padding:0 13px;border-radius:7px;font-weight:500;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.seg.wide label{flex:1}
.seg label input{position:absolute;opacity:0;inset:0;width:100%;height:100%;min-height:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--ink);color:var(--surface)}
.seg label:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:1px}
.fx{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;box-shadow:var(--shadow)}
.fx-in{min-width:640px}
.fx-row{display:grid;grid-template-columns:210px 1fr 1fr;border-top:1px solid var(--line)}
.fx-row.head{border-top:0;background:var(--surface2)}
.fx-label{padding:10px 12px;border-right:1px solid var(--line)}
.fx-row.head .fx-label{display:flex;align-items:center}
.fx-h{padding:10px 12px;font-weight:600;border-right:1px solid var(--line)}
.fx-h:last-child,.fx-cell:last-child{border-right:0}
.fx-cell{padding:8px;border-right:1px solid var(--line);display:grid;gap:8px;align-content:start;min-height:96px}
.fx-cell.over{outline:2px dashed var(--brand);outline-offset:-2px}
.fx-sum{font-size:12.5px;color:var(--muted);font-weight:600}
.fx-empty{color:var(--muted);padding:2px 4px}
.fjob{position:relative;background:color-mix(in srgb,var(--wc) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--wc) 35%,transparent);border-left:4px solid var(--wc);border-radius:9px;padding:6px 9px;font-size:13.5px;line-height:1.3;cursor:pointer;display:grid;gap:1px}
.fjob b{font-weight:600}.fjob b span{font-weight:500;color:var(--muted)}
.fjob small{color:var(--muted);font-size:12.5px}
.fjob em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--bad-text)}
.fjob.st-in_corso{box-shadow:inset 0 -3px 0 var(--brand)}
.fjob.st-fatto{opacity:.6;box-shadow:inset 0 -3px 0 var(--ok)}
.fgroup{padding:7px 14px;background:var(--surface2);border-top:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted)}
.tipi{display:grid;gap:8px;margin-bottom:12px}
.tipo-row{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center}
.tipo-row input,.tipo-row select{min-height:42px}
details.smart-panel summary{min-height:30px;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;list-style:none}
details.smart-panel summary::-webkit-details-marker{display:none}
details.smart-panel[open] summary{margin-bottom:12px}
.row-time{font:600 13.5px/1.5 var(--font-body);min-width:84px;color:var(--muted)}
.mini span:first-child{min-width:78px}
/* anagrafica e pre-fatturazione */
.tipo-row{grid-template-columns:1fr 110px 84px auto}
@media (max-width:560px){.tipo-row{grid-template-columns:1fr 1fr}.tipo-row input:first-child{grid-column:1/-1}}
.closebox{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px 4px;margin:0 0 14px}
.closebox h4{font-size:15px;margin-bottom:10px}
.pfgroup .tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.pfgroup .tags .tag{margin:0}
.pf-total{text-align:right;font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.pf-total small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.pf-rows{display:grid;gap:8px;margin:10px 0 14px}
.pf-row{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.pf-row:hover{border-color:var(--muted)}
.pf-row input{width:22px;height:22px;min-height:0;accent-color:var(--brand);margin-top:2px;flex:none}
.pf-main{flex:1;min-width:0}
.pf-main small{display:block;color:var(--muted);font-size:13.5px}
.pf-imp{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pf-imp .tag{margin:0}
.pf-foot{display:flex;gap:14px 18px;align-items:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.pf-foot .field select{min-width:210px}
.pf-sum{display:flex;gap:6px 16px;flex-wrap:wrap;flex:1;min-width:200px;color:var(--muted);font-variant-numeric:tabular-nums}
.pf-sum strong{color:var(--ink)}
/* accesso, lavoratore, utenti */
.gate{min-height:calc(100dvh - 190px);display:grid;place-items:center;padding:8px 0}
.gate-card{width:100%;max-width:420px;margin:0}
.gate-brand{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.gate-brand h2{font-size:21px}
.gate-links{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:14px;font-size:14.5px}
.w-group{border:1px solid var(--line);border-radius:10px;margin:14px 0 10px}
.w-job{position:relative;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:14px 14px 14px 16px;margin-bottom:12px;display:grid;gap:10px;box-shadow:var(--shadow)}
.w-job.st-in_corso{border-left-color:var(--brand)}
.w-job.st-fatto{border-left-color:var(--ok);opacity:.88}
.w-job h3{font-size:19px;line-height:1.25}
.w-job .line{display:flex;gap:8px;align-items:flex-start;font-weight:500}
.w-job .line .ic{margin-top:3px}
.w-job .desc{background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:15px}
.w-job .seg button,.w-job .seg label{min-height:46px;font-size:15px}
.w-job .job-actions{margin:0}
.w-job .job-actions .btn{min-height:46px}
.w-job textarea{min-height:64px}
.user-ctl{display:flex;gap:12px;flex-wrap:wrap;flex:1 1 320px}
.user-ctl .field{margin:0;min-width:170px;flex:1}
/* scheda di dettaglio */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,16,24,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:540px;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){.overlay{align-items:center}.sheet{border-radius:14px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .16s ease-out}@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
.sheet-head h2{font-size:22px;line-height:1.2}
.eyebrow{font:500 13px var(--font-mono);color:var(--muted);margin-bottom:2px}
.sheet .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sheet .tags .tag{margin:0}
dl.info{display:grid;gap:10px;margin:12px 0}
dl.info div{display:grid;grid-template-columns:96px 1fr;gap:10px}
dl.info dt{color:var(--muted);font-size:13.5px;font-weight:500;padding-top:1px}
dl.info dd{overflow-wrap:anywhere}
.job-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.job-actions .btn{flex:1 1 auto}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 12px 10px 16px;border-radius:10px;z-index:30;max-width:92vw;font-size:14.5px;display:flex;gap:12px;align-items:center}
.toast button{border:0;background:color-mix(in srgb,var(--surface) 22%,transparent);color:var(--surface);font-weight:600;border-radius:7px;min-height:32px;padding:0 12px;cursor:pointer}
/* ---- telefono: barra in alto su due righe, niente scorrimento laterale della pagina ---- */
[hidden]{display:none!important}
html,body{overflow-x:hidden}
.dash>*,.wrap>*,.card{min-width:0}
.dash{grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.dash{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr)}}
#installBtn{white-space:nowrap}
@media (max-width:560px){
  .bar{flex-wrap:wrap;gap:8px 10px}
  .bar::after{content:"";order:2;flex-basis:100%;height:0}
  h1{font-size:17px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #themeBtn{order:1}
  #sync{order:3;flex:1 1 auto;min-width:0}
  #installBtn{order:4}
  #logoutBtn{order:5}
}
/* foto dei lavori e invio giornata */
.fotobox{display:grid;gap:8px;margin:12px 0}
.fotobox .fl{font-size:13px;font-weight:600;color:var(--muted)}
.phs{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:92px;height:92px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2,var(--surface))}
.ph-img{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-x{position:absolute;top:4px;right:4px;width:26px;height:26px;min-height:0;border-radius:50%;border:0;background:rgba(16,24,38,.72);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.ph-add{justify-self:start;cursor:pointer}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px}
.lightbox img{max-width:100%;max-height:92dvh;border-radius:6px}
.lightbox button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.sendbox .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sendbox .row-main{display:grid;gap:2px}
/* stato non fatto, esito, notifiche */
.stat.st-non_fatto{background:var(--bad-tint);color:var(--bad-text)}
.stat.st-non_fatto::before{background:var(--bad)}
.st-non_fatto .chip{background:var(--bad-tint);border-color:transparent;color:var(--bad-text)}
.w-job.st-non_fatto{border-left-color:var(--bad)}
.blk.st-non_fatto,.fjob.st-non_fatto{box-shadow:inset 0 -3px 0 var(--bad)}
.esito{border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.esito strong{display:flex;align-items:center;gap:8px;font-size:17px}
.esito.esito-fatto{background:var(--ok-tint);color:var(--ok-text)}
.esito.esito-non_fatto{background:var(--bad-tint);color:var(--bad-text)}
.esito p{margin:0;color:var(--ink)} .esito small{color:var(--muted)}
.nfbox{display:grid;gap:8px;background:var(--bad-tint);border-radius:12px;padding:12px}
.icon-btn.bell{position:relative}
.bell .badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;line-height:1}
#bellBtn{order:1}
.npanel{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;left:8px;max-width:420px;margin-left:auto;max-height:80dvh;overflow:auto;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(16,24,38,.22)}
.np-head{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 8px 16px;position:sticky;top:0;background:var(--surface)}
.np-head h2{font-size:18px}
.np-perm{margin:0 12px 10px;padding:10px 12px;border-radius:10px;background:var(--brand-tint);color:var(--brand-text);display:grid;gap:8px;font-size:14px}
.np-perm .btn{justify-self:start}
.np-list{display:grid;padding:0 6px 8px}
.np-item{display:flex;gap:10px;text-align:left;border:0;background:none;padding:10px;border-radius:10px;cursor:pointer;color:var(--ink);font:inherit}
.np-item:hover{background:var(--surface2)}
.np-item.new{background:var(--brand-tint)}
.np-ico{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.k-fatto .np-ico{background:var(--ok-tint);color:var(--ok-text)} .k-non_fatto .np-ico,.k-late .np-ico{background:var(--bad-tint);color:var(--bad-text)}
.k-assign .np-ico,.k-start .np-ico{background:var(--brand-tint);color:var(--brand-text)}
.np-txt{display:grid;gap:2px;min-width:0} .np-txt span{font-size:14px;color:var(--muted)} .np-txt small{font-size:12.5px;color:var(--muted)}
/* magazzino */
.scanrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.scanfield{flex:1 1 260px;margin:0}.scanfield input{font-size:20px;min-height:54px;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em}
.qtyfield{width:96px;margin:0}.qtyfield input{min-height:54px;font-size:18px;text-align:center}
.scanrow .btn{min-height:54px}
.scanstate{margin:10px 0 0;font-size:14px;font-weight:600}.scanstate.on{color:var(--ok-text)}.scanstate.off{color:var(--warn-text)}
.scanflash{margin-top:10px;border-radius:12px;padding:14px 16px;font-size:17px;font-weight:600;background:var(--surface2);color:var(--muted)}
.scanflash.k-ok{background:var(--ok-tint);color:var(--ok-text)}.scanflash.k-new{background:var(--warn-tint);color:var(--warn-text)}.scanflash.k-undo{background:var(--surface2);color:var(--ink)}
.magtools{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.artlist{display:grid;gap:6px}
.artrow{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.artrow:hover{border-color:var(--brand)}.artrow.todo{border-left:4px solid var(--warn)}
.art-main{display:grid;gap:2px;min-width:0}.art-main small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art-q{display:grid;justify-items:end;flex:none}.art-q b{font-size:20px}.art-q small{color:var(--muted);font-size:12px}.art-q.zero b{color:var(--bad-text)}
.art-stock{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface2);border-radius:12px;padding:12px 14px;margin:8px 0 12px}
.art-stock>div{display:grid}.art-stock b{font-size:26px}.art-stock b.zero{color:var(--bad-text)}
.rettbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:grid;gap:8px;background:var(--surface)}
.rettbox h4{font-size:16px}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="mark" id="mark" aria-hidden="true"></div>
      <h1>Gestionale interventi</h1>
      <span id="sync" data-s="pending">Collegamento…</span>
      <button class="btn small" id="installBtn" hidden>Installa app</button>
      <button class="btn small ghost" id="logoutBtn" data-act="logout" hidden>Esci</button>
      <button class="icon-btn bell" id="bellBtn" data-act="notif" aria-label="Notifiche" hidden><span id="bellIc"></span><span class="badge" id="bellN" hidden></span></button>
      <button class="icon-btn" id="themeBtn" data-act="theme" aria-label="Cambia tema chiaro o scuro"></button>
    </div>
    <nav class="menu" id="menu" role="tablist" aria-label="Menu principale"></nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Dettaglio intervento"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/* false: pagina pubblicata in Claude. true: versione da ospitare sul proprio sito (suggerimenti di indirizzo Geoapify). */
const STANDALONE = true;

/* ---------- icone ---------- */
const ICONS = {
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  chat:'<path d="M21 11.5a8.4 8.4 0 0 1-12.2 7.5L3 21l2-5.6A8.4 8.4 0 1 1 21 11.5z"/>',
  edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',

/* compilazione automatica da un messaggio incollato */
function parseText(raw){
  const out = {};
  let s = String(raw || '').replace(/\r/g, '');
  const today = new Date();
  let m = s.match(/https?:\/\/(?:www\.)?(?:google\.[a-z.]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps|maps\.google\.[a-z.]+)\S*/i);
  if (m) { out.maps = m[0].replace(/[).,;]+$/, ''); s = s.replace(m[0], ' '); }
  m = s.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  if (m) { if (!out.maps) out.maps = m[1] + ', ' + m[2]; s = s.replace(m[0], ' '); }
  m = s.match(/\b(oggi|domani|dopodomani)\b/i);
  if (m) { out.data = shift(todayISO(), {oggi:0, domani:1, dopodomani:2}[m[1].toLowerCase()]); s = s.replace(m[0], ' '); }
  else {
    m = s.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/) || s.match(/\b(\d{1,2})\.(\d{1,2})\.(\d{2,4})\b/);
    if (m) {
      const dd = +m[1], mm = +m[2]; let yy = m[3] ? +m[3] : today.getFullYear(); if (yy < 100) yy += 2000;
      if (dd >= 1 && dd <= 31 && mm >= 1 && mm <= 12) { out.data = yy + '-' + pad(mm) + '-' + pad(dd); s = s.replace(m[0], ' '); }
    }
  }
  /* fascia oraria: dalle parole mattina/pomeriggio oppure da un orario */
  if (/\w*mattin\w*/i.test(s)) { out.fascia = 'mattina'; s = s.replace(/\w*mattin\w*/ig, ' '); }
  else if (/\w*pomerigg\w*/i.test(s)) { out.fascia = 'pomeriggio'; s = s.replace(/\w*pomerigg\w*/ig, ' '); }
  m = s.match(/\b(?:alle(?:\s+ore)?|ore|h)\s*(\d{1,2})(?:\s*[:.h]\s*(\d{2}))?\b/i);
  let hh = null, mi = 0;
  if (m) { hh = +m[1]; mi = m[2] ? +m[2] : 0; }
  else { m = s.match(/\b([01]?\d|2[0-3])[:h]([0-5]\d)\b/); if (m) { hh = +m[1]; mi = +m[2]; } }
  if (m && hh !== null && hh <= 23 && mi <= 59) { if (!out.fascia) out.fascia = hh < 13 ? 'mattina' : 'pomeriggio'; s = s.replace(m[0], ' '); }
  const phones = s.match(/(?:\+|00)?\d[\d\s().\-]{6,}\d/g) || [];
  for (const p of phones) {
    const n = p.replace(/\D/g, '');
    if (n.length >= 8 && n.length <= 13) { out.telefono = p.trim().replace(/\s+/g, ' '); s = s.replace(p, ' '); break; }
  }
  if (/urgent/i.test(s)) { out.priorita = 'urgente'; s = s.replace(/\burgent\w*/ig, ' '); }
  m = s.match(/\b(?:via|viale|piazza|piazzale|corso|largo|vicolo|strada|contrada|località)\s+[^\n]+/i);
  if (m) {
    let v = m[0].split(/\s[-–]\s/)[0].replace(/\s{2,}/g, ' ');
    v = v.replace(/(?:[\s,;.\-–]|\b(?:il|alle|ore|del|dal|per|e)\b)+$/i, '').trim();
    out.via = v; s = s.replace(m[0], ' ');
  }
  m = s.match(/(?:[Cc]liente|[Nn]ome|[Ss]ignor[ae]?|[Ss]ig\.ra|[Ss]ig\.)\s*[:\-]?\s*([A-ZÀ-Ý][\p{L}'’]+(?:\s+[A-ZÀ-Ý][\p{L}'’]+){0,2})/u);
  if (m) out.cliente = m[1].trim();
  else {
    /* nome da solo su una riga, oppure primo pezzo prima della virgola (es. "Mario Rossi, via Roma 3…") */
    const line = s.split(/[\n,;]/).map(x => x.trim()).find(x => /^[A-ZÀ-Ý][\p{L}'’]+(?:\s+[A-ZÀ-Ý][\p{L}'’]+){0,3}$/u.test(x));
    if (line) out.cliente = line;
  }
  /* tipo di intervento: se il messaggio contiene il nome di un tipo (es. "sopralluogo") */
  const nr = norm(raw);
  const tp = getTipi().slice().sort((a, b) => b.nome.length - a.nome.length).find(t => nr.includes(norm(t.nome)));
  if (tp) out.tipo = tp.nome;
  const t = String(raw || '').trim();
  if (t) out.descrizione = t.slice(0, 800);
  return out;
}

const CITIES = ['Agrigento','Alessandria','Ancona','Aosta','Arezzo','Ascoli Piceno','Asti','Avellino','Bari','Barletta','Belluno','Benevento','Bergamo','Biella','Bologna','Bolzano','Brescia','Brindisi','Busto Arsizio','Cagliari','Caltanissetta','Campobasso','Caserta','Catania','Catanzaro','Cesena','Chieti','Cinisello Balsamo','Como','Cosenza','Cremona','Crotone','Cuneo','Enna','Ferrara','Firenze','Foggia','Forlì','Frosinone','Genova','Gorizia','Grosseto','Imperia','Isernia','L\'Aquila','La Spezia','Latina','Lecce','Lecco','Legnano','Livorno','Lodi','Lucca','Macerata','Mantova','Massa','Matera','Messina','Milano','Modena','Monza','Napoli','Novara','Nuoro','Oristano','Padova','Palermo','Parma','Pavia','Perugia','Pesaro','Pescara','Piacenza','Pisa','Pistoia','Pordenone','Potenza','Prato','Ragusa','Ravenna','Reggio Calabria','Reggio Emilia','Rho','Rieti','Rimini','Roma','Rovigo','Salerno','Sassari','Savona','Sesto San Giovanni','Siena','Siracusa','Sondrio','Taranto','Teramo','Terni','Torino','Trapani','Trento','Treviso','Trieste','Udine','Varese','Venezia','Verbania','Vercelli','Verona','Vibo Valentia','Vicenza','Viterbo'];
const STREET_TYPES = ['Via','Viale','Piazza','Piazzale','Corso','Largo','Vicolo','Strada','Contrada','Località','Lungomare','Lungotevere','Borgo','Salita','Traversa','Circonvallazione'];
const normChar = c => { const n = c.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); return n.length === 1 ? n : (c.toLowerCase().charAt(0) || c); };
const norm = s => String(s == null ? '' : s).split('').map(normChar).join('');

let mapsAuto = true, mapsTimer = null, acItems = [], acActive = -1;

function addressBook(){
  const map = new Map();
  jobs.forEach(j => {
    const via = String(j.via || '').trim();
    if (!via) return;
    const k = norm(via);
    const e = map.get(k) || {via, maps:'', count:0, last:''};
    e.count++;
    if ((j.data || '') >= e.last) { e.last = j.data || ''; e.via = via; }
    if (j.maps) e.maps = j.maps;
    map.set(k, e);
  });
  return Array.from(map.values());
}
function suggestAddress(raw){
  const text = String(raw || '');
  const q = norm(text.trim());
  if (q.length < 2) return [];
  const tokens = q.split(/[\s,]+/).filter(Boolean);
  const out = [];
  addressBook().forEach(e => {
    const n = norm(e.via);
    if (n === q || !tokens.every(t => n.includes(t))) return;
    out.push({text: e.via, maps: e.maps, kind: 'storico', score: (n.startsWith(q) ? 2000 : 0) + e.count * 10, meta: e.count > 1 ? 'usato ' + e.count + ' volte' : 'già usato'});
  });
  const ci = text.lastIndexOf(',');
  if (ci >= 0) {
    const head = text.slice(0, ci).trim(), tail = norm(text.slice(ci + 1).trim());
    if (head && tail) CITIES.filter(c => { const n = norm(c); return n.startsWith(tail) && n !== tail; }).slice(0, 5)
      .forEach(c => out.push({text: head + ', ' + c, maps: '', kind: 'città', score: 500, meta: 'città'}));
  } else if (!/\s/.test(text.trim())) {
    STREET_TYPES.filter(t => { const n = norm(t); return n.startsWith(q) && n !== q; })
      .forEach(t => out.push({text: t + ' ', maps: '', kind: 'tipo', score: 100, meta: 'tipo di strada'}));
  }
  return out.sort((a, b) => b.score - a.score).slice(0, 6);
}
function hl(text, tokens){
  const n = norm(text);
  const marks = new Array(text.length).fill(false);
  tokens.forEach(t => {
    if (!t) return;
    let i = n.indexOf(t);
    while (i >= 0) { for (let k = i; k < i + t.length; k++) marks[k] = true; i = n.indexOf(t, i + t.length); }
  });
  let out = '', open = false;
  for (let i = 0; i < text.length; i++) {
    if (marks[i] && !open) { out += '<b>'; open = true; }
    else if (!marks[i] && open) { out += '</b>'; open = false; }
    out += esc(text[i]);
  }
  return out + (open ? '</b>' : '');
}

function acCompose(text){

  if (!remote.length) return local;
  const hist = local.filter(s => s.kind === 'storico').slice(0, 3);
  const seen = new Set(hist.map(s => norm(s.text)));

}

}
function acRefresh(){
  acRender();
  if (addrHook) addrHook.query(($('#fVia') || {}).value || '');
}
function acMove(d){
  if (!acItems.length) return;
  acActive = acActive < 0 ? (d > 0 ? 0 : acItems.length - 1) : (acActive + d + acItems.length) % acItems.length;
  document.querySelectorAll('.ac-item').forEach((el, i) => {
    el.setAttribute('aria-selected', i === acActive ? 'true' : 'false');
    if (i === acActive && el.scrollIntoView) el.scrollIntoView({block:'nearest'});
  });
  const via = $('#fVia'); if (via) via.setAttribute('aria-activedescendant', 'ac-' + acActive);
}
function setMaps(v){ const m = $('#fMaps'); if (m) m.value = v; updateMapsHint(); }
function updateMapsHint(){
  const h = $('#mapsHint'), m = $('#fMaps');
  if (!h || !m) return;
  const v = m.value.trim();
  if (!v) { h.textContent = 'Si compila da solo mentre scrivi la via. Puoi anche incollare un link o le coordinate GPS.'; return; }
  const href = /^https?:\/\//i.test(v) ? v : genMapsLink(v);
  h.innerHTML = (mapsAuto ? 'Link creato in automatico dalla via. ' : 'Link o coordinate inseriti da te. ') + `<a href="${esc(href)}" target="_blank" rel="noopener">Verifica su Google Maps</a>`;
}
function scheduleMaps(now){
  clearTimeout(mapsTimer);
  const run = () => {
    if (!mapsAuto) return;
    const via = $('#fVia'); if (!via) return;
    const v = via.value.trim();
    if (v && v === pickedVia) return;
    setMaps(v.length >= 6 && /\S+\s+\S+/.test(v) ? genMapsLink(v) : '');
  };
  if (now) run(); else mapsTimer = setTimeout(run, 450);
}
function acPick(i){
  const s = acItems[i], via = $('#fVia');
  if (!s || !via) return;
  via.value = s.text;
  if (s.kind === 'tipo') { acRefresh(); via.focus(); return; }
  acClose();
  clearTimeout(mapsTimer);
  pickedVia = s.text.trim();
  if (mapsAuto) setMaps(s.maps || genMapsLink(s.text)); else updateMapsHint();
  via.focus();
  if (s.kind === 'remote' && addrHook && addrHook.pick) {
    addrHook.pick(s).then(r => {
      if (!r || via.value.trim() !== s.text.trim()) return;
      via.value = r.via; pickedVia = r.via.trim();
      if (mapsAuto) setMaps(r.maps); else updateMapsHint();
    }).catch(() => {});
  }
}

/* ---------- salvataggio ---------- */
const LS = 'gestionale-interventi-v1';
function loadLocal(){
  try { const r = localStorage.getItem(LS); if (r) { const o = JSON.parse(r); workers = o.workers || []; jobs = o.jobs || []; tipi = o.tipi || []; clienti = o.clienti || []; prefatture = o.prefatture || []; azienda = o.azienda || {}; } } catch(e){}
}
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify({workers, jobs, tipi, clienti, prefatture, azienda})); } catch(e){} }
const chains = new Map();
function enqueue(key, fn){
  const p = (chains.get(key) || Promise.resolve()).then(fn).catch(() => toast('Salvataggio non riuscito. Riprova.'));
  chains.set(key, p);
}
function startDb(db){
  usingDb = true; dbh = db;
  setSync('online');
  db.collection('lavoratori').onSnapshot(s => { workers = s.docs.map(d => d.data()); render(); }, () => setSync('local'));
  db.collection('clienti').onSnapshot(s => { clienti = s.docs.map(d => d.data()); render(); }, () => setSync('local'));
  db.collection('prefatture').onSnapshot(s => { prefatture = s.docs.map(d => d.data()); render(); }, () => setSync('local'));
  db.collection('impostazioni').onSnapshot(s => { azienda = s.docs.map(d => d.data()).find(x => x.id === 'azienda') || {}; render(); }, () => setSync('local'));
  db.collection('tipi').onSnapshot(s => { tipi = s.docs.map(d => d.data()); render(); }, () => setSync('local'));
  db.collection('interventi').onSnapshot(s => { jobs = s.docs.map(d => d.data()); pickInitialDate(); render(); }, () => setSync('local'));
  (async () => {
    try {
      const u = await window.claude.use('user');
      if (u && typeof u.can === 'function') { const c = await u.can('data.write'); if (c === false) { canWrite = false; render(); } }
    } catch(e){}
  })();
}
async function bootDb(attempt){
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const db = await window.claude.use('db');
      if (db) { startDb(db); return; }
      setSync('local'); return;
    }
  } catch(e){}
  if (attempt < 8) setTimeout(() => bootDb(attempt + 1), 500); else setSync('local');
}

/* ---------- tema ---------- */
const THEME_KEY = 'gestionale-tema';
function effectiveTheme(){
  const a = document.documentElement.dataset.theme;
  if (a) return a;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(t){
  if (t) document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = ic(effectiveTheme() === 'dark' ? 'sun' : 'moon', 20);
}
function toggleTheme(){
  const n = effectiveTheme() === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, n); } catch(e){}
  applyTheme(n);
}

/* ---------- link utili ---------- */
function mapsHref(j){
  const m = (j.maps || '').trim();
  if (/^https?:\/\//i.test(m)) return m;
  const q = m || j.via || '';
  return q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) : '';
}
function waHref(w, list){
  let n = digits(w.telefono);
  if (n.startsWith('+')) n = n.slice(1); else if (n.startsWith('00')) n = n.slice(2); else n = '39' + n;
  const out = ['Ciao ' + w.nome + ', ecco i tuoi interventi di ' + fmtLong(date) + ':', ''];
  let last = null, i = 0;
  list.slice().sort(byFascia).forEach(j => {
    const f = fasciaOf(j);
    if (f !== last) { out.push('*' + (FASCIA_LABEL[f] || 'Senza fascia oraria').toUpperCase() + '*'); last = f; }
    i++;
    const dur = fmtDur(j.durata);
    out.push(i + ') ' + (j.tipo || 'Intervento') + (dur ? ' (' + dur + ')' : '') + (j.priorita === 'urgente' ? ' - URGENTE' : ''));
    out.push('Cliente: ' + j.cliente);
    out.push(j.via);
    if (j.telefono) out.push('Tel: ' + j.telefono);
    out.push('Mappa: ' + mapsHref(j));
    if (j.descrizione) out.push(j.descrizione);
    out.push('');
  });
  out.push('Quando finisci segna "Fatto" nell’app e, se serve, aggiungi le foto: ' + APP_URL);
  return 'https://wa.me/' + n + '?text=' + encodeURIComponent(out.join('\n').trim());
}

function loadBlock(w, day){

function kpi(label, n, sub, alert){

/* ---------- menu ---------- */
function renderMenu(){
  const wById = workerMap();
  const day = dayJobs(date);
  const un = unassignedOf(day, wById).length;
  const nb = canWrite ? billable().length : 0;
  const items = [
    ['panoramica', 'Panoramica', 'grid', ''],
    ['carica', 'Carica lavori', 'plus', day.length ? `<span class="pill">${day.length}</span>` : '', true],
    ['assegna', 'Assegna', 'timeline', un ? `<span class="pill warn" title="Da assegnare">${un}</span>` : ''],
    ['lavoratori', 'Lavoratori', 'users', workers.length ? `<span class="pill">${workers.length}</span>` : ''],
    ['anagrafica', 'Anagrafica', 'contact', clienti.length ? `<span class="pill">${clienti.length}</span>` : '', true],
    ['magazzino', 'Magazzino', 'box', daAbbinare().length ? `<span class="pill warn" title="Codici da abbinare">${daAbbinare().length}</span>` : '', true],
    ['prefat', 'Pre-fatturazione', 'filetext', nb ? `<span class="pill warn" title="Interventi da pre-fatturare">${nb}</span>` : '', true],
    ['utenti', 'Utenti', 'users', (role === 'titolare' && pendingUsers()) ? `<span class="pill warn" title="In attesa di abilitazione">${pendingUsers()}</span>` : '', true],
    ['archivio', 'Finder', 'search', '']
  ];
  $('#menu').innerHTML = items.filter(i => (canWrite || !i[4]) && (i[0] !== 'utenti' || role === 'titolare')).map(i =>
    `<button role="tab" data-act="go" data-view="${i[0]}" aria-selected="${view === i[0]}">${ic(i[2], 18)}${i[1]}${i[3]}</button>`).join('');
}
function render(){
  if (gateRender()) return;
  if (!canWrite && (view === 'carica' || view === 'anagrafica' || view === 'prefat' || view === 'magazzino')) view = 'panoramica';
  if (view === 'utenti' && role !== 'titolare') view = 'panoramica';
  renderMenu();
  if (view === 'carica') { if (mounted !== 'carica') { mountCarica(); mounted = 'carica'; } refreshCarica(); }
  else if (view === 'lavoratori') { if (mounted !== 'lavoratori') { mountLavoratori(); mounted = 'lavoratori'; } refreshLavoratori(); }
  else if (view === 'anagrafica') { if (mounted !== 'anagrafica') { mountAnagrafica(); mounted = 'anagrafica'; } refreshAnagrafica(); }
  else if (view === 'magazzino') { if (mounted !== 'magazzino') { mountMagazzino(); mounted = 'magazzino'; } refreshMagazzino(); }
  else if (view === 'prefat') { if (mounted !== 'prefat') { mountPrefat(); mounted = 'prefat'; } refreshPrefat(); }
  else if (view === 'utenti') { mounted = null; $('#app').innerHTML = viewUtenti(); }
  else if (view === 'archivio') { if (mounted !== 'archivio') { mountArchivio(); mounted = 'archivio'; } refreshArchivio(); }
  else { mounted = null; $('#app').innerHTML = view === 'assegna' ? viewAssegna() : viewPanoramica(); }
  renderDetail();
}
function setStato(id, st, causale){
  const j = jobs.find(x => x.id === id);
  if (!j || !STATI[st]) return;
  const cur = stOf(j);
  if (cur === st) return;
  if (usingDb && isClosed(cur) && role !== 'titolare') { toast('Intervento già chiuso: solo il titolare può modificarlo.'); return; }
  if (st === 'non_fatto' && role === 'lavoratore' && String(causale || '').trim().length < 3) { toast('Scrivi il motivo per cui non è stato fatto.'); return; }
  const now = new Date().toISOString();
  j.stato = st;
  if (st === 'in_corso' && role === 'lavoratore') j.inizioIl = now;
  if (isClosed(st)) { j.esitoIl = now; j.esitoDa = role === 'lavoratore' ? 'lavoratore' : 'ufficio'; }
  if (st === 'non_fatto' && causale !== undefined) j.causale = String(causale).trim().slice(0, 300);
  let msg = '';
  if (st === 'fatto' && canWrite && (j.importo === undefined || j.importo === null || j.importo === '')) {
    j.importo = prezzoOf(j.tipo);
    msg = j.importo > 0 ? `Intervento chiuso: ${fmtEur(j.importo)} da pre-fatturare.` : 'Intervento chiuso: inserisci l’importo nella scheda per la pre-fattura.';
  }
  persist('interventi', j); render();
  if (msg) toast(msg);
}

/* ---------- Panoramica ---------- */
function jobTable(day, ctx){
  if (!day.length) return '<p class="muted">Nessun intervento in programma per questa data.</p>';
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fascia</th><th>Cliente</th><th>Intervento</th><th>Indirizzo</th><th>Lavoratore</th><th>Stato</th></tr></thead><tbody>` +
    day.map(j => {
      const w = ctx.wById[j.workerId], st = stOf(j);
      return `<tr class="st-${st}"><td class="nowrap">${esc(fasciaLabel(j))}</td>
        <td><button class="linkbtn" data-act="open-job" data-id="${esc(j.id)}">${esc(j.cliente)}</button> ${tagsOf(j)}</td>
        <td>${esc(tipoText(j) || '—')}</td>
        <td>${esc(j.via)}</td>
        <td>${w ? `<span class="wtag ${cls(w)}"><i class="dotw"></i>${esc(w.nome)}</span>` : '<span class="muted">Da assegnare</span>'}</td>
        <td><span class="stat st-${st}">${STATI[st]}</span></td></tr>`;
    }).join('') + `</tbody></table></div>`;
}
function viewPanoramica(){
  const wById = workerMap();
  const day = dayJobs(date);
  const un = unassignedOf(day, wById);
  const ctx = {wById, day};
  const n = day.length;
  const f = day.filter(j => stOf(j) === 'fatto').length;
  const c = day.filter(j => stOf(j) === 'in_corso').length;
  let h = pageHead('Panoramica');
  h += `<div class="kpis">${kpi('Interventi del giorno', n)}${kpi('Da assegnare', un.length, un.length ? 'Richiede attenzione' : 'Tutti assegnati', un.length > 0)}${kpi('In corso', c)}${kpi('Completati', f, n ? Math.round(f / n * 100) + '% della giornata' : '')}</div>`;
  const lm = localMig();
  if (lm) h += `<div class="notice"><span>Ho trovato dati salvati solo su questo dispositivo (${plural((lm.jobs || []).length, 'intervento', 'interventi')}, ${plural((lm.workers || []).length, 'lavoratore', 'lavoratori')}). Vuoi importarli nell’archivio online?</span><div class="zone-actions"><button class="btn small primary" data-act="migra-locale">Importa nell’archivio online</button><button class="btn small ghost" data-act="migra-ignora">Non ora</button></div></div>`;
  if (canWrite && !workers.length) {
    h += `<div class="notice"><span>Non ci sono ancora lavoratori inseriti.</span><button class="btn small" data-act="go" data-view="lavoratori">${ic('plus', 16)}Aggiungi lavoratore</button></div>`;
  }
  const al = [];
  if (un.length) al.push(['warn', 'users', `${plural(un.length, 'intervento da assegnare', 'interventi da assegnare')}`, 'Assegna']);
  const urg = day.filter(j => j.priorita === 'urgente' && !isClosed(stOf(j))).length;
  const nfd = day.filter(j => stOf(j) === 'non_fatto').length;
  if (nfd) al.push(['bad', 'alert', `${plural(nfd, 'intervento non fatto', 'interventi non fatti')} in questa giornata`, 'Vedi', 'archivio']);
  if (urg) al.push(['bad', 'zap', `${plural(urg, 'intervento urgente aperto', 'interventi urgenti aperti')}`, 'Vedi']);
  workers.filter(isActive).forEach(w => { const m = loadOf(w, day); if (m > capOf(w)) al.push(['warn', 'alert', `${esc(w.nome)}: ${esc(fmtDur(m))} in programma, oltre le 8 ore`, 'Riequilibra']); });
  if (canWrite) { const nb = billable(); if (nb.length) al.push(['warn', 'check', `${plural(nb.length, 'intervento fatto da pre-fatturare', 'interventi fatti da pre-fatturare')} (${fmtEur(nb.reduce((a, j) => a + importoOf(j), 0))})`, 'Pre-fatturazione', 'prefat']); }
  if (role === 'titolare' && pendingUsers() > 0) al.push(['warn', 'users', `${plural(pendingUsers(), 'persona in attesa', 'persone in attesa')} di abilitazione`, 'Utenti', 'utenti']);
  const alertsHtml = al.length
    ? `<div class="alerts">` + al.map(a => `<div class="alert ${a[0]}"><div class="ico">${ic(a[1], 18)}</div><div class="msg">${a[2]}</div><button class="btn small" data-act="go" data-view="${a[4] || 'assegna'}">${a[3]}</button></div>`).join('') + `</div>`
    : `<div class="alert ok"><div class="ico">${ic('check', 18)}</div><div class="msg">Nessuna anomalia rilevata.</div></div>`;
  const rel = sortedWorkers().filter(w => isActive(w) || day.some(j => j.workerId === w.id));
  const loadHtml = rel.length
    ? `<div class="lines">` + rel.map(w => {
        const l = day.filter(j => j.workerId === w.id);
        return `<div class="wl ${cls(w)}"><div class="av">${esc(initials(w.nome))}</div>
          <div><strong>${esc(w.nome)}</strong>${isActive(w) ? '' : '<span class="tag paused">In pausa</span>'} <span class="muted">· ${plural(l.length, 'intervento', 'interventi')}</span></div>
          <div>${loadBlock(w, day)}</div></div>`;
      }).join('') + `</div>`
    : '<p class="muted">Nessun lavoratore inserito.</p>';
  h += `<div class="dash">
    <section class="panel"><div class="split"><h2 class="panel-title" style="margin:0">Programma della giornata</h2>
      ${canWrite ? `<button class="btn small" data-act="go" data-view="carica">${ic('plus', 16)}Carica lavori</button>` : ''}</div>
      ${n ? `<div style="margin-bottom:14px"><div class="split" style="margin-bottom:6px"><span class="muted">Avanzamento</span><span class="muted">${f} di ${n} completati</span></div>${progress(f, c, n)}</div>` : ''}
      ${jobTable(day, ctx)}</section>
    <div class="stack">
      <section class="panel"><h2 class="panel-title">Avvisi</h2>${alertsHtml}</section>
      <section class="panel"><h2 class="panel-title">Carico dei lavoratori</h2>${loadHtml}</section>
    </div></div>`;
  return h;
}

function fjob(j){

function viewFasce(lanesW, day){

          <span class="sub">${plural(l.length, 'intervento', 'interventi')}</span></div>
        <div class="zone-actions">${w.telefono ? `<a class="btn small" href="tel:${esc(digits(w.telefono))}" aria-label="Chiama ${esc(w.nome)}">${ic('phone', 16)}</a>` : ''}
          ${w.telefono && l.length ? `<a class="btn small" data-act="wa-sent" data-w="${esc(w.id)}" data-sig="${esc(waSig(l))}" href="${esc(waHref(w, l))}" target="_blank" rel="noopener">${ic('chat', 16)}Invia giornata</a>` : ''}

/* sotto-menu: giornata lavorativa / crea nuova giornata lavorativa */
function assSubnav(){
  const b = (sub, icon, label) => `<button role="tab" data-act="ass-sub" data-sub="${sub}" aria-selected="${assSub === sub}">${ic(icon, 16)}${label}</button>`;
  return `<div class="subnav" role="tablist" aria-label="Sezioni di Assegna">${b('giornata', 'timeline', 'Giornata lavorativa')}${canWrite ? b('nuova', 'plus', 'Crea nuova giornata lavorativa') : ''}</div>`;
}
function viewGiornata(){
  const wById = workerMap();
  const day = dayJobs(date);
  const un = unassignedOf(day, wById);
  const act = sortedWorkers().filter(isActive);
  const lanesW = act.concat(sortedWorkers().filter(w => !isActive(w) && day.some(j => j.workerId === w.id)));
  const avg = act.length ? Math.round(act.reduce((s, w) => s + pctOf(w, day), 0) / act.length) : 0;
  let h = `<div class="statline"><span><b>${day.length}</b>${day.length === 1 ? 'intervento' : 'interventi'}</span><span><b>${day.length - un.length}</b>assegnati</span>
    <span class="${un.length ? 'warnx' : ''}"><b>${un.length}</b>da assegnare</span><span><b>${avg}%</b>carico medio</span></div>`;
  h += `<div class="toolbar"><div class="seg" role="group" aria-label="Modalità di visualizzazione">
      <button data-act="ass-mode" data-mode="fasce" aria-pressed="${assMode === 'fasce'}">${ic('grid', 16)}Fasce</button>
      <button data-act="ass-mode" data-mode="elenco" aria-pressed="${assMode === 'elenco'}">${ic('list', 16)}Elenco</button></div></div>`;
  if (un.length) {
    h += `<div class="notice"><div><strong>${plural(un.length, 'lavoro non ancora assegnato', 'lavori non ancora assegnati')}</strong> in questa giornata
      <div class="untimed">${un.map(j => `<button class="uchip" data-act="open-job" data-id="${esc(j.id)}">${esc(j.cliente)}</button>`).join('')}</div></div>
      ${canWrite ? `<div class="zone-actions"><button class="btn small primary" data-act="wz-open">${ic('plus', 16)}Crea giornata</button>
        ${act.length ? `<button class="btn small" data-act="auto">${ic('sparkles', 16)}Assegna in automatico</button>` : ''}</div>` : ''}</div>`;
  }
  if (!lanesW.length) {
    return h + `<div class="empty"><h3>Nessun lavoratore in servizio</h3><p>Inserisci i lavoratori per vedere il carico e assegnare i lavori.</p>
      ${canWrite ? `<button class="btn primary" data-act="go" data-view="lavoratori">${ic('plus', 16)}Aggiungi lavoratore</button>` : ''}</div>`;
  }
  return h + sendPanel(lanesW, day) + (assMode === 'fasce' ? viewFasce(lanesW, day) : viewElenco(lanesW, day));
}
/* ---------- invio della giornata ai lavoratori (WhatsApp, un tocco ciascuno) ---------- */
const WA_KEY = 'gestionale-wa-sent-v1';
function waSig(l){ return l.map(j => [j.id, fasciaOf(j), j.tipo, j.via, j.durata, j.descrizione].join('~')).join('|'); }
function waSentGet(){ try { return JSON.parse(localStorage.getItem(WA_KEY) || '{}'); } catch(e){ return {}; } }
function waSentSet(k, v){ const m = waSentGet(); m[k] = v; try { localStorage.setItem(WA_KEY, JSON.stringify(m)); } catch(e){} }
function sendPanel(lanesW, day){
  if (!canWrite) return '';
  const rows = lanesW.map(w => ({w, l: day.filter(j => j.workerId === w.id).sort(byFascia)})).filter(r => r.l.length);
  if (!rows.length) return '';
  const m = waSentGet();
  let sentN = 0;
  const body = rows.map(({w, l}) => {
    const sig = waSig(l), prev = m[date + '|' + w.id];
    const st = !w.telefono ? 'nophone' : prev === sig ? 'sent' : prev ? 'changed' : 'todo';
    if (st === 'sent') sentN++;
    const tag = {sent: '<span class="tag type">Inviata</span>', changed: '<span class="tag late">Cambiata dopo l’invio</span>', todo: '<span class="tag paused">Da inviare</span>', nophone: '<span class="tag late">Manca il telefono</span>'}[st];
    const btn = st === 'nophone' ? `<button class="btn small" data-act="go" data-view="lavoratori">Aggiungi numero</button>`
      : `<a class="btn small${st === 'sent' ? '' : ' primary'}" data-act="wa-sent" data-w="${esc(w.id)}" data-sig="${esc(sig)}" href="${esc(waHref(w, l))}" target="_blank" rel="noopener">${ic('chat', 16)}${st === 'sent' ? 'Invia di nuovo' : st === 'changed' ? 'Reinvia' : 'Invia su WhatsApp'}</a>`;
    return `<div class="row"><div class="row-main"><strong>${esc(w.nome)}</strong> ${tag}<small>${plural(l.length, 'intervento', 'interventi')}</small></div>${btn}</div>`;
  }).join('');
  return `<div class="panel sendbox"><h2 class="panel-title">Invia la giornata ai lavoratori</h2>
    <p class="muted" style="margin:0 0 8px">Un tocco per lavoratore: si apre WhatsApp con il messaggio già pronto (fasce, tipo, durata, indirizzo e mappa). ${sentN} di ${rows.length} inviate.</p>
    <div class="rows">${body}</div></div>`;
}

/* crea nuova giornata lavorativa: lavoratore + giornata + lavori da selezionare */
function wzCands(){
  const wById = workerMap();
  return jobs.filter(j => !wById[j.workerId] && !isClosed(stOf(j)) && (wzOther || j.data === wzDate))
    .sort((a, b) => (a.data === wzDate ? 0 : 1) - (b.data === wzDate ? 0 : 1) || a.data.localeCompare(b.data) || byFascia(a, b));
}
function wzCalc(){
  const w = workers.find(x => x.id === wzWorker) || null;
  const sel = jobs.filter(j => wzSel.has(j.id));
  const existing = w ? jobs.filter(j => j.data === wzDate && j.workerId === w.id) : [];
  const cap = w ? capOf(w) : 480;
  const mins = existing.concat(sel).reduce((s, j) => s + durOf(j), 0);
  return {w, sel, existing, mins, cap, pct: Math.round(mins / cap * 100), moved: sel.filter(j => j.data !== wzDate).length};
}
function wzSummaryHtml(){
  const c = wzCalc();
  const n = c.sel.length;
  let notes = '';
  if (c.w && c.mins > c.cap) notes += `<p class="wz-warn">${ic('alert', 14)}Il carico supera le 8 ore della giornata.</p>`;
  if (c.moved) notes += `<p class="wz-warn">${ic('clock', 14)}${plural(c.moved, 'lavoro verrà spostato', 'lavori verranno spostati')} al ${esc(fmtShort(wzDate))}.</p>`;
  const ready = !!c.w && n > 0;
  return `<div class="wz-sum"><strong>${n ? plural(n, 'lavoro selezionato', 'lavori selezionati') : 'Nessun lavoro selezionato'}</strong>${c.w ? ` · carico ${esc(fmtDur(c.mins) || '0 h')} / ${esc(fmtDur(c.cap))} (${c.pct}%)` : ''}${notes}</div>
    <div class="zone-actions"><button class="btn" data-act="wz-cancel">Annulla</button>
    <button class="btn primary" data-act="wz-create"${ready ? '' : ' disabled'}>${ic('check', 18)}Crea giornata</button></div>`;
}
function pitemHtml(j){
  const on = wzSel.has(j.id);
  return `<label class="pitem${on ? ' sel' : ''}"><input type="checkbox" data-act="wz-sel" data-id="${esc(j.id)}"${on ? ' checked' : ''}>
    <div class="pmain"><div class="t"><strong>${esc(j.cliente)}</strong><span class="muted">${esc(fasciaLabel(j))}</span>${tagsOf(j)}</div>
      <small>${subline(j)}</small>
      ${j.data !== wzDate ? `<small class="moved">Previsto il ${esc(fmtShort(j.data))}: verrà spostato</small>` : ''}</div></label>`;
}
function viewNuova(){
  const act = sortedWorkers().filter(isActive);
  const wById = workerMap();
  if (wzWorker && !act.some(w => w.id === wzWorker)) wzWorker = '';
  const cands = wzCands();
  const ids = new Set(cands.map(j => j.id));
  wzSel = new Set([...wzSel].filter(id => ids.has(id)));
  const pool = jobs.filter(j => !wById[j.workerId] && !isClosed(stOf(j)));
  const others = pool.filter(j => j.data !== wzDate).length;

  if (!act.length) {
    return `<section class="panel"><h2 class="page-title">Crea nuova giornata lavorativa</h2><div class="empty"><h3>Nessun lavoratore in servizio</h3>

  }
  let ctxHtml;
  if (!c.w) ctxHtml = '<p class="muted" style="margin-bottom:14px">Scegli il lavoratore per vedere i lavori già assegnati nella giornata.</p>';
  else {
    ctxHtml = `<div class="wzctx ${cls(c.w)}"><div class="av" aria-hidden="true">${esc(initials(c.w.nome))}</div>
      <div style="flex:1;min-width:0"><strong>${esc(c.w.nome)}</strong><small>${c.existing.length ? plural(c.existing.length, 'lavoro già assegnato', 'lavori già assegnati') : 'Nessun lavoro ancora assegnato'} il ${esc(fmtShort(wzDate))}</small>
      ${c.existing.slice().sort(byFascia).map(j => `<div class="mini"><span>${esc(fasciaLabel(j))}</span><span>${esc(j.tipo || 'Intervento')} · ${esc(j.cliente)}</span></div>`).join('')}</div></div>`;
  }
  let list;
  if (!pool.length) {
    list = `<div class="empty"><h3>Non ci sono lavori da assegnare</h3><p>I lavori si caricano dal menu «Carica lavori»: appena inseriti compariranno qui.</p>
      <button class="btn primary" data-act="go" data-view="carica">${ic('plus', 16)}Vai a Carica lavori</button></div>`;
  } else if (!cands.length) {
    list = `<p class="muted" style="margin-bottom:14px">Nessun lavoro da assegnare per ${esc(fmtShort(wzDate))}.${others && !wzOther ? ' Attiva l’opzione qui sopra per vedere quelli di altre date.' : ''}</p>`;
  } else list = `<div class="pick">${cands.map(pitemHtml).join('')}</div>`;
  return `<section class="panel wz"><h2 class="page-title">Crea nuova giornata lavorativa</h2>
    <div class="fgrid">
      <label class="field"><span>Lavoratore</span><select id="wzWorker"><option value="">Scegli il lavoratore…</option>
        ${act.map(w => `<option value="${esc(w.id)}"${w.id === wzWorker ? ' selected' : ''}>${esc(w.nome)}</option>`).join('')}</select></label>
      <label class="field"><span>Giornata lavorativa</span><input type="date" id="wzDate" required value="${esc(wzDate)}"></label>
    </div>
    ${ctxHtml}
    ${pool.length ? `<div class="split"><h3 style="font-size:16px">Lavori da assegnare${cands.length ? ' (' + cands.length + ')' : ''}</h3>
      <div class="zone-actions"><button class="btn small ghost" data-act="wz-all">Seleziona tutti</button><button class="btn small ghost" data-act="wz-none">Deseleziona</button></div></div>
      ${others || wzOther ? `<label class="field check"><input type="checkbox" data-act="wz-other"${wzOther ? ' checked' : ''}><span>Mostra anche ${plural(others, 'lavoro', 'lavori')} da assegnare di altre date</span></label>` : ''}` : ''}
    ${list}
    ${pool.length ? `<div class="wz-bar" id="wzSummary">${wzSummaryHtml()}</div>` : ''}</section>`;
}
function openWizard(workerId){
  assSub = 'nuova'; view = 'assegna'; mounted = null; detailId = null;

}
function wzCreate(){
  const c = wzCalc();
  if (!c.w || !c.sel.length) return;
  const prev = c.sel.map(j => ({id: j.id, workerId: j.workerId, data: j.data}));
  const w = c.w, n = c.sel.length, d = wzDate;
  c.sel.forEach(j => { j.workerId = w.id; j.data = d; persist('interventi', j); });
  date = d; datePicked = true; assSub = 'giornata'; wzSel = new Set(); wzWorker = ''; mounted = null;
  render(); window.scrollTo(0, 0);
  toast(`Giornata creata: ${plural(n, 'lavoro assegnato', 'lavori assegnati')} a ${w.nome} per ${fmtShort(d)}.`, 'Annulla', () => {
    prev.forEach(p => { const j = jobs.find(x => x.id === p.id); if (j) { j.workerId = p.workerId; j.data = p.data; persist('interventi', j); } });
    render();

}
