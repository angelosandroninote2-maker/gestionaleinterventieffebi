    let line = '';
    par.split(/\s+/).filter(Boolean).forEach(word => {
      let w = word;
      while (pdfWidth(w, size, bold) > maxW) {
        let k = w.length; while (k > 1 && pdfWidth(w.slice(0, k), size, bold) > maxW) k--;
        if (line) { out.push(line); line = ''; }
        out.push(w.slice(0, k)); w = w.slice(k);
      }
      const t = line ? line + ' ' + w : w;
      if (pdfWidth(t, size, bold) <= maxW) line = t; else { if (line) out.push(line); line = w; }
    });
    out.push(line);
  });
  return out.length ? out : [''];
}
function pdfBuilder(){
  const pages = [];
  let cur = null;
  const f2 = n => (Math.round(n * 100) / 100).toFixed(2);
  const esc = s => s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  const col = c => (c || [0, 0, 0]).map(v => f2(v)).join(' ');
  const api = {
    page(){ cur = []; pages.push(cur); return pages.length; },
    get count(){ return pages.length; },
    __goto(n){ cur = pages[n - 1]; },
    text(x, y, str, size, o){
      o = o || {};
      let xx = x; const w = pdfWidth(str, size, o.bold);
      if (o.align === 'right') xx = x - w; else if (o.align === 'center') xx = x - w / 2;
      cur.push(`BT /${o.bold ? 'F2' : 'F1'} ${f2(size)} Tf ${col(o.color)} rg ${f2(xx)} ${f2(PDF_H - y)} Td (${esc(pdfEnc(str))}) Tj ET`);
    },
    line(x1, y1, x2, y2, w, color){ cur.push(`${col(color)} RG ${f2(w || 0.5)} w ${f2(x1)} ${f2(PDF_H - y1)} m ${f2(x2)} ${f2(PDF_H - y2)} l S`); },
    rect(x, y, w, h, fill, stroke){
      cur.push(`${fill ? col(fill) + ' rg ' : ''}${stroke ? col(stroke) + ' RG 0.6 w ' : ''}${f2(x)} ${f2(PDF_H - y - h)} ${f2(w)} ${f2(h)} re ${fill && stroke ? 'B' : fill ? 'f' : 'S'}`);
    },
    build(title){
      const objs = [];
      objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
      const kids = pages.map((_, i) => (5 + i * 2) + ' 0 R').join(' ');
      objs[2] = `<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`;
      objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      pages.forEach((ops, i) => {
        const pn = 5 + i * 2, cn = pn + 1;
        const stream = ops.join('\n');
        objs[pn] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f2(PDF_W)} ${f2(PDF_H)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cn} 0 R >>`;
        objs[cn] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
      });
      const infoN = objs.length;
      objs[infoN] = `<< /Title (${esc(pdfEnc(title || 'Pre-fattura'))}) /Producer (Gestionale interventi) >>`;
      let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
      const offs = [];
      for (let n = 1; n < objs.length; n++) { offs[n] = out.length; out += n + ' 0 obj\n' + objs[n] + '\nendobj\n'; }
      const xref = out.length;
      out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
      for (let n = 1; n < objs.length; n++) out += String(offs[n]).padStart(10, '0') + ' 00000 n \n';
      out += `trailer\n<< /Size ${objs.length} /Root 1 0 R /Info ${infoN} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
      const bytes = new Uint8Array(out.length);
      for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xFF;
      return bytes;
    }
  };
  return api;
}

function buildPrefatturaPdf(pf, az){
  az = az || {};
  const d = pf.destinatario || {};
  const L = 48, R = PDF_W - 48, W = R - L, GREY = [0.42, 0.45, 0.5], DARK = [0.08, 0.1, 0.15], LIGHT = [0.95, 0.96, 0.97];
  const doc = pdfBuilder();
  const colData = L + 6, colDesc = L + 66, descW = 262, colQ = R - 118, colP = R - 62, colI = R - 6;
  const eur = n => fmtNum(n) + ' €';
  const dmy = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : (s || ''); };
  const tableHead = y => {
    doc.rect(L, y, W, 20, LIGHT);
    doc.text(colData, y + 13.5, 'Data', 8.5, {bold: true, color: GREY});
    doc.text(colDesc, y + 13.5, 'Descrizione', 8.5, {bold: true, color: GREY});
    doc.text(colQ, y + 13.5, 'Q.tà', 8.5, {bold: true, color: GREY, align: 'right'});
    doc.text(colP, y + 13.5, 'Prezzo', 8.5, {bold: true, color: GREY, align: 'right'});
    doc.text(colI, y + 13.5, 'Importo', 8.5, {bold: true, color: GREY, align: 'right'});
    return y + 20;
  };
  doc.page();
  /* intestazione: dati dell'azienda a sinistra, titolo a destra */
  let y = 54;
  const aziendaNome = (az.ragione || '').trim();
  doc.text(L, y, aziendaNome || 'Intestazione non compilata', 15, {bold: true, color: aziendaNome ? DARK : GREY});
  y += 16;
  const aLines = [az.indirizzo, [az.piva ? 'P.IVA ' + az.piva : '', az.cf ? 'C.F. ' + az.cf : ''].filter(Boolean).join('  ·  '), [az.telefono, az.email].filter(Boolean).join('  ·  ')].filter(x => x && String(x).trim());
  if (!aLines.length && !aziendaNome) aLines.push('Compila i dati dell’azienda nella pagina Pre-fatturazione.');
  aLines.forEach(t => { doc.text(L, y, t, 9, {color: GREY}); y += 12; });
  doc.text(R, 54, 'PRE-FATTURA', 20, {bold: true, align: 'right', color: DARK});
  doc.text(R, 72, 'N. ' + pf.numero, 11, {bold: true, align: 'right'});
  doc.text(R, 86, 'Data: ' + dmy(pf.data), 10, {align: 'right', color: GREY});
  y = Math.max(y, 98) + 10;
  doc.line(L, y, R, y, 0.8, [0.8, 0.82, 0.86]);
  y += 16;
  /* destinatario */
  const nomeD = d.tipo === 'azienda' ? (d.ragione || '') : [d.nome, d.cognome].filter(Boolean).join(' ');
  const indirizzo = [d.via, [d.cap, d.citta].filter(Boolean).join(' ') + (d.prov ? ' (' + d.prov + ')' : '')].filter(x => x && String(x).trim()).join(', ');
  const fisc = [d.piva ? 'P.IVA ' + d.piva : '', d.cf ? 'C.F. ' + d.cf : ''].filter(Boolean).join('  ·  ');
  const sdi = d.tipo === 'azienda' ? [d.sdi ? 'Codice destinatario: ' + d.sdi : '', d.pec ? 'PEC: ' + d.pec : ''].filter(Boolean).join('  ·  ') : (d.pec ? 'PEC: ' + d.pec : '');
  const contatti = [d.telefono, d.email].filter(Boolean).join('  ·  ');
  const dLines = [indirizzo, fisc, sdi, d.tipo === 'azienda' && d.referente ? 'Referente: ' + d.referente : '', contatti].filter(x => x && String(x).trim());
  const nameLines = pdfWrap(nomeD || '—', W - 24, 12, true);
  const boxH = 34 + (nameLines.length - 1) * 14 + dLines.length * 12 + 6;
  doc.rect(L, y, W, boxH, LIGHT);
  doc.text(L + 12, y + 16, 'DESTINATARIO', 8, {bold: true, color: GREY});
  nameLines.forEach((t, i) => doc.text(L + 12, y + 32 + i * 14, t, 12, {bold: true}));
  dLines.forEach((t, i) => doc.text(L + 12, y + 46 + (nameLines.length - 1) * 14 + i * 12, t, 9, {color: [0.2, 0.22, 0.28]}));
  y += boxH + 22;
  /* tabella righe */
  y = tableHead(y);
  const bottom = PDF_H - 150;
  (pf.righe || []).forEach(r => {
    const l1 = pdfWrap(r.descrizione || 'Intervento', descW, 10, true);
    const l2 = r.dettaglio ? pdfWrap(r.dettaglio, descW, 8.5, false) : [];
    const h = 10 + l1.length * 12 + l2.length * 11 + 4;
    if (y + h > bottom) { doc.page(); y = 54; doc.text(L, y, 'Pre-fattura ' + pf.numero + ' (continua)', 10, {bold: true, color: GREY}); y = tableHead(y + 14); }
    doc.text(colData, y + 14, dmy(r.data), 9);
    l1.forEach((t, i) => doc.text(colDesc, y + 14 + i * 12, t, 10, {bold: true}));
    l2.forEach((t, i) => doc.text(colDesc, y + 14 + l1.length * 12 + i * 11, t, 8.5, {color: GREY}));
    doc.text(colQ, y + 14, String(r.qta == null ? 1 : r.qta), 9.5, {align: 'right'});
    doc.text(colP, y + 14, eur(r.prezzo), 9.5, {align: 'right'});
    doc.text(colI, y + 14, eur(r.importo), 9.5, {align: 'right', bold: true});
    y += h;
    doc.line(L, y, R, y, 0.4, [0.86, 0.88, 0.91]);
  });
  /* totali */
  if (y + 96 > PDF_H - 70) { doc.page(); y = 54; }
  y += 18;
  const tx = R - 210, tvx = R - 6;
  doc.text(tx, y, 'Imponibile', 10, {color: GREY}); doc.text(tvx, y, eur(pf.imponibile), 10, {align: 'right'}); y += 16;
  doc.text(tx, y, Number(pf.iva) > 0 ? 'IVA ' + pf.iva + '%' : 'IVA (esente / fuori campo)', 10, {color: GREY}); doc.text(tvx, y, eur(pf.ivaImporto), 10, {align: 'right'}); y += 8;
  doc.line(tx, y, R, y, 0.8, [0.7, 0.72, 0.78]); y += 17;
  doc.text(tx, y, 'TOTALE', 12, {bold: true}); doc.text(tvx, y, eur(pf.totale), 13, {align: 'right', bold: true}); y += 26;
  /* note e pagamento */
  const notes = [];
  if (pf.note) notes.push(pf.note);
  if (az.pagamento) notes.push(az.pagamento);
  if (az.iban) notes.push('IBAN: ' + az.iban);
  if (notes.length) {
    if (y + 20 + notes.length * 24 > PDF_H - 60) { doc.page(); y = 54; }
    doc.text(L, y, 'NOTE E PAGAMENTO', 8, {bold: true, color: GREY}); y += 13;
    notes.forEach(n => pdfWrap(n, W, 9, false).forEach(t => { doc.text(L, y, t, 9); y += 12; }));
  }
  /* piè di pagina su ogni pagina */
  const total = doc.count;
  for (let i = 1; i <= total; i++) {
    doc.__goto(i);
    doc.line(L, PDF_H - 52, R, PDF_H - 52, 0.4, [0.8, 0.82, 0.86]);
    doc.text(L, PDF_H - 38, 'Documento di pre-fatturazione, non valido ai fini fiscali. La fattura elettronica viene emessa separatamente.', 7.5, {color: GREY});
    doc.text(R, PDF_H - 38, 'Pagina ' + i + ' di ' + total, 7.5, {align: 'right', color: GREY});
  }
  return doc.build('Pre-fattura ' + pf.numero);
}

const dmy = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : (s || ''); };
const IVA_OPTS = [[22, 'IVA 22%'], [10, 'IVA 10%'], [4, 'IVA 4%'], [0, 'Senza IVA (esente / fuori campo)']];
const nomeDest = p => nomeCliente(p.destinatario || {}) || '—';
function pfGroups(){
  const map = new Map();

    const c = (j.clienteId && clienteById(j.clienteId)) || clienteByName(j.cliente);
    const key = c ? c.id : 'n:' + norm(j.cliente);

const normCode = c => String(c || '').replace(/\s+/g, '').toUpperCase();
function buildCodeMap(){ codeMap = {}; articoli.forEach(a => { (a.codici || []).forEach(c => { codeMap[normCode(c)] = a.id; }); if (a.codice) codeMap[normCode(a.codice)] = codeMap[normCode(a.codice)] || a.id; }); }
const daAbbinare = () => articoli.filter(a => a.daAbbinare);
const artById = id => articoli.find(a => a.id === id);
const artNome = a => a ? (a.descrizione || (a.daAbbinare ? 'Codice da abbinare' : 'Articolo senza nome')) : '';
const qtaOf = a => Number(a && a.giacenza) || 0;
const chiSono = () => (me && me.email) || '';
let audioCtx = null;
function beep(ok){
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const tones = ok ? [[1046, 0, 0.07]] : [[523, 0, 0.09], [392, 0.12, 0.12]];
    tones.forEach(([f, at, d]) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = f; o.type = 'sine';
      g.gain.value = 0.08; o.connect(g); g.connect(audioCtx.destination); const t0 = audioCtx.currentTime + at; o.start(t0); o.stop(t0 + d); });
  } catch(e){}
}
function newId(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function scanCode(raw, qtaRaw){
  const code = normCode(raw), qta = Math.max(1, Math.min(9999, parseInt(qtaRaw, 10) || 1));
  if (!code || !usingDb) return;
  let id = codeMap[code], created = false;
  if (!id) {   // codice mai visto: nuovo articolo "da abbinare"
    id = newId('a'); created = true;
    const a = {id, codici: [code], codice: '', descrizione: '', marca: '', categoria: '', prezzo: null, giacenza: qta, daAbbinare: true, creato: new Date().toISOString()};
    articoli.push(a); codeMap[code] = id;
    fb.setDoc(fb.doc(fb.db, 'articoli', id), a).catch(() => toast('Non sono riuscito a salvare il codice nuovo.'));
  } else {
    const a = artById(id); if (a) a.giacenza = qtaOf(a) + qta;
    fb.updateDoc(fb.doc(fb.db, 'articoli', id), {giacenza: fb.increment(qta)}).catch(() => toast('Non sono riuscito ad aggiornare la giacenza.'));
  }
  const mid = newId('m');
  fb.setDoc(fb.doc(fb.db, 'movimenti', mid), {id: mid, articoloId: id, tipo: 'carico', qta, codice: code, chi: chiSono(), quando: new Date().toISOString()}).catch(() => {});
  scanLog.unshift({mid, id, code, qta, created, t: Date.now(), annullato: false});
  scanLog = scanLog.slice(0, 30);
  beep(!created);
  const a = artById(id);
  magFlash(created ? 'new' : 'ok', created ? `Codice nuovo ${code}: +${qta}, messo tra quelli da abbinare` : `+${qta} ${artNome(a)} · ora ${qtaOf(a)}`);
  refreshMagazzino();
}
function undoScan(mid){
  const s = scanLog.find(x => x.mid === mid); if (!s || s.annullato) return;
  s.annullato = true;
  const a = artById(s.id);
  if (s.created && a && qtaOf(a) <= s.qta) { articoli = articoli.filter(x => x.id !== s.id); delete codeMap[s.code]; fb.deleteDoc(fb.doc(fb.db, 'articoli', s.id)).catch(() => {}); }
  else { if (a) a.giacenza = qtaOf(a) - s.qta; fb.updateDoc(fb.doc(fb.db, 'articoli', s.id), {giacenza: fb.increment(-s.qta)}).catch(() => {}); }
  fb.deleteDoc(fb.doc(fb.db, 'movimenti', mid)).catch(() => {});
  magFlash('undo', 'Sparo annullato.'); refreshMagazzino();
}
function magFlash(kind, msg){ const f = $('#scanFlash'); if (!f) return; f.className = 'scanflash k-' + kind; f.textContent = msg; }

    <div class="subnav" role="tablist" aria-label="Sezioni del magazzino">${tab('carico', 'scan', 'Carico rapido')}${tab('articoli', 'box', 'Articoli', '<span class="pill" id="magCntA">0</span>')}${tab('abbinare', 'alert', 'Da abbinare', '<span class="pill warn" id="magCntD">0</span>')}</div>`;

  }
  $('#app').innerHTML = head + body;

}
function scanStateUpd(){

  st.className = 'scanstate ' + (on ? 'on' : 'off');
  st.innerHTML = on ? '● Pronto: spara il codice' : '● In pausa: <button class="linkbtn" data-act="scan-focus">tocca qui per riprendere a sparare</button>';

function artRow(a){
  const q = qtaOf(a);
  return `<button class="artrow${a.daAbbinare ? ' todo' : ''}" data-act="art-open" data-id="${esc(a.id)}">

function refreshMagazzino(){
  const ca = $('#magCntA'), cd = $('#magCntD');
  if (ca) ca.textContent = articoli.filter(a => !a.daAbbinare).length;
  if (cd) cd.textContent = daAbbinare().length;
  const sl = $('#scanList');
  if (sl) sl.innerHTML = scanLog.length ? `<div class="rows">` + scanLog.map(s => { const a = artById(s.id);
      return `<div class="row${s.annullato ? ' st-fatto' : ''}"><div class="row-main"><strong>+${s.qta} ${esc(a ? artNome(a) : 'Codice ' + s.code)}</strong>${s.created ? ' <span class="tag late">Nuovo</span>' : ''}${s.annullato ? ' <span class="tag paused">Annullato</span>' : ''}
        <small>${esc(s.code)} · ${esc(hhmm(new Date(s.t).toISOString()))}${a && !s.annullato ? ' · giacenza attuale ' + qtaOf(a) : ''}</small></div>
        ${s.annullato ? '' : `<button class="btn small ghost" data-act="scan-undo" data-id="${esc(s.mid)}">Annulla</button>`}</div>`; }).join('') + `</div>`
    : '<p class="muted">Ancora nessuno sparo in questa sessione.</p>';
  const al = $('#artList');

    const q = norm(magQ.trim());

    if (magTab === 'articoli' && magFlt === 'zero') l = l.filter(a => qtaOf(a) <= 0);
    if (magTab === 'articoli' && magFlt === 'nome') l = l.filter(a => a.descrizione);
    if (q) l = l.filter(a => norm([a.descrizione, a.codice, a.marca, a.categoria].concat(a.codici || []).join(' ')).includes(q));
    l = l.slice().sort((x, y) => artNome(x).localeCompare(artNome(y)));
    al.innerHTML = l.length ? `<div class="artlist">${l.slice(0, 300).map(artRow).join('')}</div>${l.length > 300 ? `<p class="muted">Mostro i primi 300 di ${l.length}: affina la ricerca.</p>` : ''}`
      : `<p class="muted">${magTab === 'abbinare' ? 'Nessun codice da abbinare.' : articoli.length ? 'Nessun articolo corrisponde.' : 'Ancora nessun articolo: inizia dal Carico rapido.'}</p>`;
  }
  renderArt();
}
/* scheda articolo */
function artSubMov(id){
  if (id === artMovKey) return;
  if (artMovUnsub) { try { artMovUnsub(); } catch(e){} artMovUnsub = null; }
  artMovKey = id || ''; artMov = [];
  if (!id) return;
  artMovUnsub = fb.onSnapshot(fb.query(fb.collection(fb.db, 'movimenti'), fb.where('articoloId', '==', id)), s => {
    artMov = s.docs.map(d => d.data()).sort((a, b) => a.quando < b.quando ? 1 : -1); renderArt(); }, fbSnapErr);
}
function renderArt(){

      ${owner ? `<button class="btn" data-act="rett-open">${ic('edit', 16)}Correggi giacenza</button>` : '<small class="muted">Le correzioni le fa il titolare.</small>'}</div>
    <div id="rettBox" hidden></div>
    <form id="artForm" data-id="${esc(a.id)}"><div class="fgrid">
      <label class="field span2"><span>Descrizione</span><input id="artDesc" name="descrizione" maxlength="160" value="${esc(a.descrizione || '')}" placeholder="Es. Motore scorrevole BFT Deimos"></label>
      <label class="field"><span>Marca</span><select id="artMarca" name="marca">${opts(marche, a.marca || '')}</select></label>
      <label class="field"><span>Codice articolo (del produttore)</span><input id="artCod" name="codice" maxlength="40" value="${esc(a.codice || '')}"></label>
      <label class="field span2"><span>Codici a barre abbinati</span><input id="artBar" name="codici" value="${esc((a.codici || []).join(', '))}"><small class="muted">Separati da virgola. Si riempiono da soli sparando.</small></label>
    </div><div class="form-actions"><button class="btn primary" type="submit">${ic('check', 16)}Salva scheda</button>
      ${owner ? `<button class="btn danger" type="button" data-act="art-del" data-id="${esc(a.id)}">${ic('trash', 16)}Elimina articolo</button>` : ''}</div></form>
    <h3 class="panel-title" style="margin-top:18px">Movimenti</h3><div id="artMovList">${artMovHtml()}</div></div>`;
  ov.hidden = false;
}
function artMovHtml(){
  if (!artMov.length) return '<p class="muted">Nessun movimento registrato.</p>';
  const lab = {carico: 'Entrata', scarico: 'Uscita', rettifica: 'Correzione'}, mot = Object.fromEntries(MOTIVI_RETT);
  return `<div class="rows">` + artMov.slice(0, 50).map(m => `<div class="row"><div class="row-main"><strong>${lab[m.tipo] || m.tipo} ${m.qta > 0 ? '+' : ''}${m.qta}</strong>${m.tipo === 'rettifica' ? ` <span class="muted">(${m.prima} → ${m.dopo} pz · ${esc(mot[m.motivo] || m.motivo || '')})</span>` : ''}
    <small>${esc(whenTxt(m.quando))}${m.chi ? ' · ' + esc(m.chi) : ''}${m.nota ? ' · ' + esc(m.nota) : ''}</small></div></div>`).join('') + `</div>`;
}
function openRett(){
  const a = artById(artId), b = $('#rettBox'); if (!a || !b) return;
  b.hidden = false;
  b.innerHTML = `<div class="rettbox"><h4>Correggi giacenza</h4><p class="muted" style="margin:0">Adesso risultano <b>${qtaOf(a)}</b> pezzi. Scrivi quanti ce ne sono davvero.</p>
    <div class="fgrid"><label class="field"><span>Pezzi reali</span><input id="rettQ" type="number" min="0" max="99999" inputmode="numeric" value="${qtaOf(a)}"></label>
    <label class="field"><span>Motivo</span><select id="rettM">${opts(MOTIVI_RETT, 'conteggio')}</select></label>
    <label class="field span2"><span>Nota (facoltativa)</span><input id="rettN" maxlength="120" placeholder="Es. trovato danneggiato in furgone"></label></div>
    <div class="form-actions"><button class="btn primary" data-act="rett-ok">Conferma correzione</button><button class="btn" data-act="rett-cancel">Annulla</button></div></div>`;
  const i = $('#rettQ'); if (i) { i.focus(); i.select(); }
}
function doRett(){
  const a = artById(artId); if (!a || role !== 'titolare') return;
  const v = parseInt(($('#rettQ') || {}).value, 10), m = ($('#rettM') || {}).value || 'altro', nota = String(($('#rettN') || {}).value || '').trim().slice(0, 120);
  if (!isFinite(v) || v < 0) { toast('Scrivi un numero di pezzi valido.'); return; }
  const prima = qtaOf(a), d = v - prima;
  if (!d) { toast('La giacenza è già ' + v + ': niente da correggere.'); const b = $('#rettBox'); if (b) b.hidden = true; return; }
  a.giacenza = v;
  fb.updateDoc(fb.doc(fb.db, 'articoli', a.id), {giacenza: v}).catch(() => toast('Non sono riuscito a salvare la correzione.'));
  const mid = newId('m');
  fb.setDoc(fb.doc(fb.db, 'movimenti', mid), {id: mid, articoloId: a.id, tipo: 'rettifica', qta: d, prima, dopo: v, motivo: m, nota, chi: chiSono(), quando: new Date().toISOString()})
    .catch(e => toast(e && e.code === 'permission-denied' ? 'Solo il titolare può correggere la giacenza.' : 'Correzione non registrata nello storico.'));
  toast('Giacenza corretta: ' + prima + ' → ' + v + ' pz.');
  const ov = $('#artOverlay'); if (ov) ov.innerHTML = ''; renderArt(); refreshMagazzino();
}
function saveArt(f){
  const a = artById(f.dataset.id); if (!a) return;
  const fd = new FormData(f);
  const codici = String(fd.get('codici') || '').split(/[,;\n]/).map(normCode).filter(Boolean).filter((c, i, arr) => arr.indexOf(c) === i);
  const clash = codici.find(c => codeMap[c] && codeMap[c] !== a.id);
  if (clash) { toast('Il codice ' + clash + ' è già abbinato a «' + artNome(artById(codeMap[clash])) + '».'); return; }
  const patch = {descrizione: String(fd.get('descrizione') || '').trim().slice(0, 160), marca: String(fd.get('marca') || ''), codice: normCode(fd.get('codice')).slice(0, 40), codici};
  if (patch.descrizione && a.daAbbinare) patch.daAbbinare = false;
  Object.assign(a, patch); buildCodeMap();
  fb.updateDoc(fb.doc(fb.db, 'articoli', a.id), patch).catch(() => toast('Non sono riuscito a salvare la scheda.'));
  toast(patch.daAbbinare === false ? 'Scheda salvata: l’articolo passa tra gli Articoli.' : 'Scheda salvata.');
  const ov = $('#artOverlay'); if (ov) ov.innerHTML = ''; renderArt(); refreshMagazzino();
}

/* ---------- centro notifiche ---------- */
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
let notifOpen = false;
function notifEvents(){
  if (authState !== 'ready') return [];
  const ev = [], wById = workerMap(), now = Date.now(), since = now - 7 * 864e5, ok = t => t && Date.parse(t) > since;
  const what = j => (j.tipo || 'Intervento') + ' · ' + (j.cliente || '');
  if (role === 'lavoratore') {
    jobs.forEach(j => { if (ok(j.assegnatoIl)) ev.push({id: 'a-' + j.id + '-' + j.assegnatoIl, t: j.assegnatoIl, kind: 'assign', job: j.id,
      title: 'Nuovo intervento assegnato', body: what(j) + ' · ' + fmtShort(j.data) + (fasciaOf(j) ? ', ' + fasciaLabel(j).toLowerCase() : '')}); });
  } else {
    jobs.forEach(j => {
      const w = wById[j.workerId], wn = w ? w.nome : 'Lavoratore', st = stOf(j);
      if (ok(j.inizioIl)) ev.push({id: 's-' + j.id + '-' + j.inizioIl, t: j.inizioIl, kind: 'start', job: j.id, title: wn + ' ha iniziato', body: what(j)});
      if (isClosed(st) && j.esitoDa === 'lavoratore' && ok(j.esitoIl)) ev.push({id: 'e-' + j.id + '-' + j.esitoIl, t: j.esitoIl, kind: st, job: j.id,
        title: st === 'fatto' ? wn + ': intervento fatto' : wn + ': intervento NON fatto', body: what(j) + (st === 'non_fatto' && j.causale ? ' — Motivo: ' + j.causale : '')});
      if (st === 'in_corso' && j.inizioIl) { const due = Date.parse(j.inizioIl) + durOf(j) * 90000;
        if (due < now && due > since) ev.push({id: 'l-' + j.id + '-' + j.inizioIl, t: new Date(due).toISOString(), kind: 'late', job: j.id,
          title: 'In corso da più del previsto', body: wn + ' · ' + what(j) + ' (previsto ' + fmtDur(durOf(j)) + ')'}); }
    });
  }
  return ev.sort((a, b) => a.t < b.t ? 1 : -1).slice(0, 60);
}
const seenKey = () => 'gestionale-notif-seen-' + (me ? me.uid : '');
function updateBell(){
  const b = $('#bellBtn'); if (!b) return;
  b.hidden = authState !== 'ready';
  if (b.hidden) return;
  const seen = lsGet(seenKey()), n = notifEvents().filter(e => e.t > seen).length;
  const badge = $('#bellN'); badge.hidden = !n; badge.textContent = n > 9 ? '9+' : String(n);
  b.setAttribute('aria-label', n ? 'Notifiche: ' + n + ' nuove' : 'Notifiche');
  if (notifOpen) renderNotif();
}
function notifToggle(force){
  notifOpen = force === undefined ? !notifOpen : !!force;
  let p = $('#npanel');
  if (!p) { if (!notifOpen) return; p = document.createElement('div'); p.id = 'npanel'; p.className = 'npanel'; document.body.appendChild(p); }
  p.hidden = !notifOpen;
  if (notifOpen) renderNotif();
}
function renderNotif(){
  const p = $('#npanel'); if (!p) return;
  const ev = notifEvents(), seen = lsGet(seenKey());
  const can = 'Notification' in window, perm = can ? Notification.permission : 'unsupported';
  const icoOf = {assign: 'plus', start: 'clock', fatto: 'check', non_fatto: 'x', late: 'alert'};
  p.innerHTML = `<div class="np-head"><h2>Notifiche</h2><button class="icon-btn" data-act="notif-close" aria-label="Chiudi">${ic('x', 20)}</button></div>
    ${can && perm !== 'granted' ? `<div class="np-perm">${perm === 'denied' ? 'Le notifiche sul telefono sono bloccate: riattivale dalle impostazioni del browser per questo sito.' : 'Ricevi gli avvisi anche come notifiche del telefono.'}
      ${perm !== 'denied' ? `<button class="btn small primary" data-act="notif-perm">Attiva notifiche</button>` : ''}</div>` : ''}
    ${ev.length ? `<div class="np-list">` + ev.map(e => `<button class="np-item k-${e.kind}${e.t > seen ? ' new' : ''}" data-act="notif-go" data-id="${esc(e.job)}">
        <span class="np-ico">${ic(icoOf[e.kind] || 'alert', 16)}</span><span class="np-txt"><strong>${esc(e.title)}</strong><span>${esc(e.body)}</span><small>${esc(whenTxt(e.t))}</small></span></button>`).join('') + `</div>`
      : `<p class="muted" style="padding:16px">${role === 'lavoratore' ? 'Qui trovi gli interventi che ti vengono assegnati.' : 'Qui trovi gli interventi iniziati, chiusi o non fatti dai lavoratori e quelli in ritardo.'}</p>`}`;
  if (ev.length && ev[0].t > seen) { lsSet(seenKey(), ev[0].t); const badge = $('#bellN'); if (badge) badge.hidden = true; }
}
async function notifAskPerm(){
  try { await Notification.requestPermission(); } catch(e){}
  renderNotif();
  if ('Notification' in window && Notification.permission === 'granted') sysNotify({id: 'test', title: 'Notifiche attive', body: 'Riceverai qui gli avvisi del gestionale.'});
}
async function sysNotify(e){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opt = {body: e.body, tag: e.id, icon: 'icon-192.png', badge: 'icon-192.png', data: {url: APP_URL}};
  try { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) { await reg.showNotification(e.title, opt); return; } } catch(x){}
  try { new Notification(e.title, opt); } catch(x){}
}
function notifyCheck(){
  if (!me || authState !== 'ready') { updateBell(); return; }
  const key = 'gestionale-notif-sys-' + me.uid, last = lsGet(key), ev = notifEvents();
  if (!last) { lsSet(key, ev.length ? ev[0].t : new Date().toISOString()); updateBell(); return; }
  const fresh = ev.filter(e => e.t > last && Date.now() - Date.parse(e.t) < 6 * 3600e3).reverse();

/* ---------- suggerimenti di indirizzo Geoapify (dati OpenStreetMap) ---------- */
/* 1) Incolla qui la tua chiave API di Geoapify (registrazione gratuita, senza carta): https://myprojects.geoapify.com */
const GEOAPIFY_API_KEY = 'INSERISCI_QUI_LA_TUA_CHIAVE';
/* 2) Facoltativo: dai la precedenza alla tua zona di lavoro. Esempio: {lat: 45.4642, lng: 9.19}. Lascia null per tutta Italia. */
const ZONA_DI_LAVORO = null;

let gSeq = 0, gTimer = null, gBroken = false, gAbort = null;
const gKeyOk = () => /^[A-Za-z0-9]{16,64}$/.test(GEOAPIFY_API_KEY);
const gEnabled = () => gKeyOk() && !gBroken;
const gNote = t => { const n = $('#gNote'); if (n) n.textContent = t || ''; };
function gStatus(){
  if (!gKeyOk()) gNote('Suggerimenti Geoapify non attivi: manca la chiave nel file. Funzionano i suggerimenti dagli indirizzi già usati.');
  else if (gBroken) gNote('Suggerimenti Geoapify non disponibili: controlla la chiave e i siti consentiti.');
  else gNote('');
}
function gText(x){
  return String(x.formatted || [x.address_line1, x.address_line2].filter(Boolean).join(', ')).replace(/,\s*Italia$/, '').trim();
}
/* se hai scritto il numero civico ma l'indirizzo trovato è solo la via, il numero viene mantenuto */
function gRow(x, civico){
  let text = gText(x);
  if (civico && !x.housenumber && x.result_type === 'street' && x.address_line1 && x.address_line2) {
    text = x.address_line1 + ' ' + civico + ', ' + String(x.address_line2).replace(/,\s*Italia$/, '');
  }
  return text ? {text, maps: genMapsLink(text), kind: 'remote', meta: 'Geoapify'} : null;
}
function gQuery(text){
  clearTimeout(gTimer);
  if (gAbort) { try { gAbort.abort(); } catch(e){} gAbort = null; }
  if (!gEnabled()) return;
  const t = String(text || '').trim();
  if (t.length < 3) { acRemote = []; acRemoteFor = ''; return; }
  const seq = ++gSeq;
  gTimer = setTimeout(async () => {
    try {
      const p = new URLSearchParams({text: t, lang: 'it', filter: 'countrycode:it', limit: '6', apiKey: GEOAPIFY_API_KEY});
      if (ZONA_DI_LAVORO) p.set('bias', 'proximity:' + ZONA_DI_LAVORO.lng + ',' + ZONA_DI_LAVORO.lat);
      gAbort = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const r = await fetch('https://api.geoapify.com/v1/geocode/autocomplete?' + p.toString(), gAbort ? {signal: gAbort.signal} : {});
      if (seq !== gSeq) return;
      if (r.status === 401 || r.status === 403) { gBroken = true; gStatus(); return; }
      if (r.status === 429) { gNote('Limite giornaliero di Geoapify raggiunto: restano i suggerimenti dagli indirizzi già usati.'); return; }
      if (!r.ok) return;
      const data = await r.json();
      if (seq !== gSeq) return;
      const m = t.split(',')[0].trim().match(/\s(\d{1,4}[A-Za-z]?)$/);
      const rows = Array.isArray(data.results) ? data.results : (data.features || []).map(f => f.properties || {});
      const seen = new Set();
      acRemote = rows.map(x => gRow(x, m ? m[1] : '')).filter(x => { if (!x) return false; const k = norm(x.text); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 5);
      acRemoteFor = text;
      gNote('');
      const via = $('#fVia');
      if (via && document.activeElement === via && via.value === text) acRender();
    } catch(err) { /* rete assente o richiesta annullata: restano i suggerimenti locali */ }
  }, 250);
}
addrHook = {query: gQuery, status: gStatus,
  attribution: 'Suggerimenti da <a href="https://www.geoapify.com/" target="_blank" rel="noopener">Geoapify</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'};

  if (/invalid-email/.test(c)) return 'L’indirizzo email non sembra valido.';
  if (/too-many-requests/.test(c)) return 'Troppi tentativi: riprova tra qualche minuto.';
  if (/network/.test(c)) return 'Nessuna connessione: riprova.';
  if (/operation-not-allowed/.test(c)) return 'L’accesso con email e password non è attivo nel progetto.';
  if (/unauthorized-domain/.test(c)) return 'Questo indirizzo non è tra i domini autorizzati del progetto.';

async function compressImage(file){
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation: 'from-image'}); }
  catch(e) { bmp = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = URL.createObjectURL(file); }); }
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  let max = 1280, q = 0.72, out = null;
  for (let k = 0; k < 5; k++) {
    const sc = Math.min(1, max / Math.max(w0, h0)), w = Math.max(1, Math.round(w0 * sc)), h = Math.max(1, Math.round(h0 * sc));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(bmp, 0, 0, w, h);
    const url = c.toDataURL('image/jpeg', q);
    out = {data: url, w, h};
    if (url.length < 650000) break;
    max = Math.round(max * 0.8); q = Math.max(0.5, q - 0.06);
  }
  if (bmp.close) { try { bmp.close(); } catch(e){} }
  return out;
}
async function addFoto(jobId, files){

  const room = Math.max(0, MAX_FOTO - fotoOf(jobId).length);
  const list = files.filter(f => !f.type || /^image\//.test(f.type)).slice(0, room);
  if (!list.length) { toast('Hai raggiunto il massimo di ' + MAX_FOTO + ' foto per questo intervento.'); return; }
  toast(list.length === 1 ? 'Carico la foto…' : 'Carico ' + list.length + ' foto…');
  let ok = 0, denied = false;
  for (const f of list) {
    try {
      const img = await compressImage(f);
      const id = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      fb.setDoc(fb.doc(fb.db, 'foto', id), {id, jobId, workerId: j.workerId || '', giorno: j.data, creato: new Date().toISOString(), w: img.w, h: img.h, data: img.data})

      return `<div class="row ${r ? '' : 'st-in_corso'}"><div class="row-main"><strong>${esc(u.email || '—')}</strong>${self ? ' <span class="tag type">Tu</span>' : ''}${r ? '' : ' <span class="tag late">In attesa</span>'}
        <small>Registrato il ${esc(dmy(u.creato))}</small></div>
        <div class="user-ctl"><label class="field"><span>Ruolo</span><select data-act="u-ruolo" data-uid="${esc(u.uid)}"${self ? ' disabled' : ''}>${opts(roles, r)}</select></label>
        ${r === 'lavoratore' ? `<label class="field"><span>Collegato a</span><select data-act="u-worker" data-uid="${esc(u.uid)}">${sortedWorkers().length ? '<option value="">Scegli il lavoratore…</option>' + sortedWorkers().map(w => `<option value="${esc(w.id)}"${w.id === u.workerId ? ' selected' : ''}>${esc(w.nome)}</option>`).join('') : '<option value="">Prima inserisci i lavoratori</option>'}</select></label>` : ''}</div></div>`;
    }).join('') + `</div>` : '<p class="muted">Nessun utente registrato.</p>'}</div>
    <div class="panel"><h2 class="panel-title">Come funzionano i ruoli</h2>
      <p class="muted"><b>Titolare</b>: vede e fa tutto, compresa la gestione degli utenti. <b>Ufficio</b>: lavori, anagrafica e pre-fatture. <b>Lavoratore</b>: vede solo i propri interventi, cambia lo stato e lascia una nota; non vede prezzi né dati fiscali dei clienti. Chi si registra resta «in attesa» finché non gli assegni un ruolo.</p></div>`;
}
async function setUserRole(uid, ruolo){
  try {
    const patch = {ruolo};
    if (ruolo !== 'lavoratore') patch.workerId = '';
    await fb.updateDoc(fb.doc(fb.db, 'utenti', uid), patch);
    toast('Ruolo aggiornato.');
  } catch(e) { toast('Non sono riuscito a salvare il ruolo.'); }
}
async function setUserWorker(uid, workerId){
  try { await fb.updateDoc(fb.doc(fb.db, 'utenti', uid), {workerId}); toast('Collegamento salvato.'); }
  catch(e) { toast('Non sono riuscito a salvare il collegamento.'); }
}

/* ---- migrazione dei dati salvati nel browser ---- */
function localMig(){
  try {
    if (role !== 'titolare' || migHidden || localStorage.getItem('gest-migrato') === '1') return null;
    const o = JSON.parse(localStorage.getItem(LS) || 'null');
    return o && ((o.jobs || []).length + (o.workers || []).length + (o.clienti || []).length) ? o : null;
  } catch(e) { return null; }
}
function migraLocale(){
  const o = localMig(); if (!o) return;
  importData({app: 'gestionale-interventi', lavoratori: o.workers, interventi: o.jobs, tipi: o.tipi, clienti: o.clienti, prefatture: o.prefatture, azienda: o.azienda});
  try { localStorage.setItem('gest-migrato', '1'); } catch(e){}
  render();
}
function setSync(s){
  const el = $('#sync'); if (!el) return;
  const r = ROLE_LABEL[role] && role ? ' · ' + ROLE_LABEL[role] : '';
  el.dataset.s = s === 'online' ? 'online' : s === 'local' ? 'local' : 'pending';
  el.textContent = s === 'online' ? 'Online' + r : s === 'local' ? 'Senza rete: salvo appena torna' + r : (me ? 'Collegamento…' : 'Accesso');
  el.title = me && me.email ? me.email : '';
}
function persist(coll, item){ if (usingDb) enqueue(coll + '/' + item.id, () => fbWrite(coll, item)); }
function unpersist(coll, id){ if (usingDb) enqueue(coll + '/' + id, () => fbRemove(coll, id)); }

/* ---------- avvio ---------- */
$('#mark').innerHTML = ic('pin', 20);
$('#bellIc').innerHTML = ic('bell', 20);
let savedTheme = null;
try { savedTheme = localStorage.getItem(THEME_KEY); } catch(e){}
applyTheme(savedTheme);
render();
bootFirebase();
/* ---------- app installabile (Android) ---------- */
(() => {
  let ev = null; const b = document.getElementById('installBtn'); if (!b) return;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev = e; b.hidden = false; });
  b.addEventListener('click', async () => { if (!ev) return; b.hidden = true; ev.prompt(); try { await ev.userChoice; } catch(e){} ev = null; });
  window.addEventListener('appinstalled', () => { b.hidden = true; ev = null; });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();

/* aggiorna ritardi e linea dell'ora ogni minuto, senza disturbare chi sta scrivendo */
setInterval(() => {
  const a = document.activeElement;
  if (a && /^(SELECT|INPUT|TEXTAREA)$/.test(a.tagName)) return;
  if (detailId) return;
  if (authState === 'ready' && (view === 'panoramica' || view === 'assegna')) render();
}, 60000);
})();
</script>
