document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('[draggable="true"][data-id]');
  if (c) { e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; }
});
document.addEventListener('dragover', e => {
  const z = e.target.closest && e.target.closest('[data-drop]');
  if (z && canWrite) { e.preventDefault(); z.classList.add('over'); }
});
document.addEventListener('dragleave', e => {
  const z = e.target.closest && e.target.closest('[data-drop]');
  if (z && !z.contains(e.relatedTarget)) z.classList.remove('over');
});
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('[data-drop]');
  if (!z || !canWrite) return;
  e.preventDefault(); z.classList.remove('over');
  const id = e.dataTransfer.getData('text/plain');
  if (id) assign(id, z.dataset.drop);
});

/* ---------- suggerimenti di indirizzo Geoapify (dati OpenStreetMap) ---------- */
/* 1) Incolla qui la tua chiave API di Geoapify (registrazione gratuita, senza carta): https://myprojects.geoapify.com */
const GEOAPIFY_API_KEY = 'INSERISCI_QUI_LA_TUA_CHIAVE';
/* 2) Facoltativo: dai la precedenza alla tua zona di lavoro. Esempio: {lat: 45.4642, lng: 9.19}. Lascia null per tutta Italia. */
const ZONA_DI_LAVORO = null;

let gSeq = 0, gTimer = null, gBroken = false, gAbort = null;
const gKeyOk = () => /^[A-Za-z0-9]{16,64}$/.test(GEOAPIFY_API_KEY);
const gEnabled = () => gKeyOk() && !gBroken;
const gNote = t => { const n = $('#gNote'); if (n) n.textContent = t || ''; };
function gStatus(){
  if (!gKeyOk()) gNote('Suggerimenti Geoapify non attivi: manca la chiave nel file. Funzionano i suggerimenti dagli indirizzi già usati.');
  else if (gBroken) gNote('Suggerimenti Geoapify non disponibili: controlla la chiave e i siti consentiti.');
  else gNote('');
}
function gText(x){
  return String(x.formatted || [x.address_line1, x.address_line2].filter(Boolean).join(', ')).replace(/,\s*Italia$/, '').trim();
}
/* se hai scritto il numero civico ma l'indirizzo trovato è solo la via, il numero viene mantenuto */
function gRow(x, civico){
  let text = gText(x);
  if (civico && !x.housenumber && x.result_type === 'street' && x.address_line1 && x.address_line2) {
    text = x.address_line1 + ' ' + civico + ', ' + String(x.address_line2).replace(/,\s*Italia$/, '');
  }
  return text ? {text, maps: genMapsLink(text), kind: 'remote', meta: 'Geoapify'} : null;
}
function gQuery(text){
  clearTimeout(gTimer);
  if (gAbort) { try { gAbort.abort(); } catch(e){} gAbort = null; }
  if (!gEnabled()) return;
  const t = String(text || '').trim();
  if (t.length < 3) { acRemote = []; acRemoteFor = ''; return; }
  const seq = ++gSeq;
  gTimer = setTimeout(async () => {
    try {
      const p = new URLSearchParams({text: t, lang: 'it', filter: 'countrycode:it', limit: '6', apiKey: GEOAPIFY_API_KEY});
      if (ZONA_DI_LAVORO) p.set('bias', 'proximity:' + ZONA_DI_LAVORO.lng + ',' + ZONA_DI_LAVORO.lat);
      gAbort = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const r = await fetch('https://api.geoapify.com/v1/geocode/autocomplete?' + p.toString(), gAbort ? {signal: gAbort.signal} : {});
      if (seq !== gSeq) return;
      if (r.status === 401 || r.status === 403) { gBroken = true; gStatus(); return; }
      if (r.status === 429) { gNote('Limite giornaliero di Geoapify raggiunto: restano i suggerimenti dagli indirizzi già usati.'); return; }
      if (!r.ok) return;
      const data = await r.json();
      if (seq !== gSeq) return;
      const m = t.split(',')[0].trim().match(/\s(\d{1,4}[A-Za-z]?)$/);
      const rows = Array.isArray(data.results) ? data.results : (data.features || []).map(f => f.properties || {});
      const seen = new Set();
      acRemote = rows.map(x => gRow(x, m ? m[1] : '')).filter(x => { if (!x) return false; const k = norm(x.text); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 5);
      acRemoteFor = text;
      gNote('');
      const via = $('#fVia');
      if (via && document.activeElement === via && via.value === text) acRender();
    } catch(err) { /* rete assente o richiesta annullata: restano i suggerimenti locali */ }
  }, 250);
}
addrHook = {query: gQuery, status: gStatus,
  attribution: 'Suggerimenti da <a href="https://www.geoapify.com/" target="_blank" rel="noopener">Geoapify</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'};

/* ---------- avvio ---------- */
$('#mark').innerHTML = ic('pin', 20);
let savedTheme = null;
try { savedTheme = localStorage.getItem(THEME_KEY); } catch(e){}
applyTheme(savedTheme);
loadLocal();
pickInitialDate();
render();
setSync('local');
/* aggiorna ritardi e linea dell'ora ogni minuto, senza disturbare chi sta scrivendo */
setInterval(() => {
  const a = document.activeElement;
  if (a && /^(SELECT|INPUT|TEXTAREA)$/.test(a.tagName)) return;
  if (detailId) return;
  if (view === 'panoramica' || view === 'assegna') render();
}, 60000);
})();
